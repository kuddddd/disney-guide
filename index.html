<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WDW Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* --- TOKENS LIGHT (padrão) --- */
:root {
  --bg:#F2F4F7; --bg2:#E8EBF0; --surface:#ffffff; --surface2:#F0F2F7;
  --border:rgba(0,0,0,0.09);
  --gold:#B45309; --gold2:#92400E; --blue:#0057A8; --green:#047857;
  --red:#B91C1C; --orange:#C2410C; --purple:#6D28D9;
  --text:#0F1C2E; --text2:#6B7280; --text3:#9CA3AF;
  --mk:#0057A8; --ep:#047857; --hs:#B91C1C;
  --shadow:rgba(0,0,0,0.08); --radius:16px;
}
/* --- TOKENS DARK --- */
[data-theme="dark"] {
  --bg:#080a10; --bg2:#0e1018; --surface:#161924; --surface2:#1e2230;
  --border:rgba(255,255,255,0.06);
  --gold:#f0b429; --gold2:#d4960f; --blue:#4d9fff; --green:#34d399;
  --red:#f87171; --orange:#fb923c; --purple:#a78bfa;
  --text:#eceef4; --text2:#7c82a0; --text3:#404560;
  --mk:#3b82f6; --ep:#10b981; --hs:#ef4444;
  --shadow:rgba(0,0,0,0.5); --radius:16px;
}
/* --- RESET --- */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}

/* --- APP SHELL --- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

/* --- ROUTER --- */
.router{flex:1;display:flex;width:200%;transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.router.on-park{transform:translateX(-50%);}
.view{width:50%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* --- STARS --- */
.stars{position:absolute;inset:0;pointer-events:none;z-index:0;transition:opacity .4s;opacity:0;}
[data-theme="dark"] .stars{opacity:1;}
.stars::before,.stars::after{content:'';position:absolute;inset:0;background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55) 0%,transparent 100%),
  radial-gradient(1px 1px at 38% 7%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 67% 30%,rgba(255,255,255,.35) 0%,transparent 100%),
  radial-gradient(1px 1px at 82% 55%,rgba(255,255,255,.5) 0%,transparent 100%),
  radial-gradient(2px 2px at 45% 25%,rgba(240,180,41,.35) 0%,transparent 100%),
  radial-gradient(2px 2px at 88% 75%,rgba(77,159,255,.25) 0%,transparent 100%);}

/* --- LOADING --- */
#loading{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;}
#loading.hide{opacity:0;pointer-events:none;}
.ld-castle{font-size:48px;animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ld-text{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;}
.ld-bar{width:100px;height:2px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));animation:ldbar 1.4s ease-in-out infinite;}
@keyframes ldbar{0%{width:0;margin-left:0}50%{width:55%;margin-left:22%}100%{width:0;margin-left:100%}}

/* --- TOAST --- */
#toast{position:fixed;top:0;left:0;right:0;z-index:998;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#0f1118;font-weight:600;font-size:13px;padding:14px 20px;gap:10px;display:none;align-items:center;box-shadow:0 4px 20px rgba(240,180,41,.4);animation:slideD .3s ease;}
#toast.show{display:flex;}
@keyframes slideD{from{transform:translateY(-100%)}to{transform:translateY(0)}}
#toast .t-close{margin-left:auto;cursor:pointer;font-size:18px;opacity:.7;}

/* --- HOME --- */
#view-home{position:relative;background:var(--bg);}
.home-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
.home-scroll::-webkit-scrollbar{display:none;}

/* Hero — sem fundo, logo flutua */
.home-hero{width:100%;flex-shrink:0;}
.home-hero-inner{max-width:480px;margin:0 auto;padding:16px 20px 0;}
.home-hero-topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:16px;}
.btn-refresh-all{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;box-shadow:0 1px 4px var(--shadow);}
.btn-refresh-all:active{background:var(--surface2);}
.btn-refresh-all .ri{transition:transform .3s;display:inline-block;}
.btn-refresh-all.spinning .ri{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-pill{width:46px;height:26px;border-radius:13px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;position:relative;flex-shrink:0;box-shadow:0 1px 4px var(--shadow);}
.theme-pill::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--blue);transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
[data-theme="dark"] .theme-pill::before{transform:translateX(20px);background:var(--gold);}
.theme-pill .ti{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;pointer-events:none;user-select:none;color:var(--text3);}
.theme-pill .ti-moon{left:5px;}.theme-pill .ti-sun{right:5px;}
/* Disney Parks SVG logo */
.home-disney-logo{display:flex;justify-content:center;align-items:baseline;gap:0;padding:10px 0 2px;line-height:1;}
.home-disney-logo .logo-disney{font-family:'Pacifico',cursive;font-size:48px;letter-spacing:-0.5px;}
.home-disney-logo .logo-parks{font-family:'Cinzel',serif;font-size:22px;font-weight:600;letter-spacing:4px;text-transform:uppercase;margin-left:8px;align-self:flex-end;padding-bottom:6px;}
.home-sub{font-size:11px;color:var(--text3);font-weight:400;text-align:center;padding-bottom:4px;letter-spacing:.3px;}

/* Park list */
.park-list{width:100%;max-width:480px;padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;}
.park-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;overflow:hidden;box-shadow:0 1px 4px var(--shadow),0 4px 14px var(--shadow);transition:transform .15s ease,box-shadow .15s ease;}
.park-card:active{transform:scale(0.975);box-shadow:0 1px 2px var(--shadow);}
.park-card-body{padding:16px 16px 14px;display:flex;align-items:center;gap:14px;}
/* Logo SVG do parque */
.park-logo-wrap{width:90px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.park-logo-wrap svg{max-width:90px;max-height:40px;width:100%;height:100%;}
.park-info{flex:1;min-width:0;}
.park-hours{font-size:12px;color:var(--text2);margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.park-hours-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.park-hours-dot.closed{background:var(--red);}
.park-stats{display:flex;gap:16px;}
.pstat-val{font-size:18px;font-weight:700;line-height:1;}
.pstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:1px;}
.park-arrow{color:var(--text3);font-size:20px;flex-shrink:0;}
.home-footer{width:100%;max-width:480px;padding:14px 20px 32px;font-size:11px;color:var(--text3);text-align:center;}

/* --- PARK VIEW --- */
#view-park{background:var(--bg);}
.park-header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);width:100%;}
.ph-inner{max-width:480px;margin:0 auto;padding:0 16px;}
.ph-top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;}
.btn-back{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.btn-back:active{background:var(--surface);}
.ph-meta{flex:1;min-width:0;}
.ph-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph-status{font-size:11px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:5px;}
.ph-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.2s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ph-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-icon{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.btn-icon:active{background:var(--surface);}
.btn-icon.spinning{animation:spin .8s linear infinite;}
.tab-bar{display:flex;border-top:1px solid var(--border);}
.tab{flex:1;padding:10px 4px 12px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;text-align:center;letter-spacing:.2px;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.park-body{flex:1;overflow:hidden;position:relative;}
.tab-panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .2s;}
.tab-panel::-webkit-scrollbar{display:none;}
.tab-panel.active{opacity:1;pointer-events:auto;}
.panel-inner{max-width:480px;margin:0 auto;padding:16px 16px 80px;}

/* --- SECTION --- */
.sec-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;margin-top:20px;}
.sec-label:first-child{margin-top:0;}

/* --- SHOW ROW (resumo) --- */
.show-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.sr-timer{text-align:center;min-width:44px;}
.sr-num{font-size:20px;font-weight:700;color:var(--gold);line-height:1;}
.sr-unit{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.sr-div{width:1px;height:32px;background:var(--border);flex-shrink:0;}
.sr-info{flex:1;min-width:0;}
.sr-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.sr-time{font-size:11px;color:var(--text2);}
.badge-soon{background:rgba(240,180,41,.14);color:var(--gold);font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;}

/* --- QUEUE ROW (resumo) --- */
.queue-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.qr-wait{text-align:center;min-width:44px;}
.qr-num{font-size:20px;font-weight:700;line-height:1;}
.qr-unit{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.qr-info{flex:1;min-width:0;}
.qr-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.qr-trend{font-size:11px;color:var(--text2);}

/* --- FILTERS --- */
.sort-row{display:flex;align-items:center;gap:7px;margin-bottom:14px;}
.att-search-wrap{position:relative;margin-bottom:10px;}
.att-search{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 36px 9px 14px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;}
.att-search:focus{border-color:var(--gold);}
.att-search::placeholder{color:var(--text3);}
.att-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0;line-height:1;display:none;}
.att-search-clear.visible{display:block;}
.sort-lbl{font-size:11px;color:var(--text3);flex-shrink:0;}
.sort-btn{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;flex-shrink:0;}
.sort-btn.active{background:var(--surface2);color:var(--text);border-color:var(--text3);}

/* --- ATTRACTION CARD --- */
.att-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;margin-bottom:8px;position:relative;overflow:hidden;transition:opacity .2s,border-color .2s;}
.att-card.visited{opacity:.42;}
.att-card.expanded{border-color:rgba(240,180,41,.25);}
.att-card.visited::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(128,128,128,.03) 9px,rgba(128,128,128,.03) 10px);pointer-events:none;}
.att-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.att-wait{text-align:center;min-width:48px;flex-shrink:0;}
.att-num{font-size:22px;font-weight:700;line-height:1;}
.att-unit{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.att-body{flex:1;min-width:0;}
.att-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:5px;}
.att-tags{display:flex;flex-wrap:wrap;gap:4px;}
.att-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.att-detail.open{display:block;}
.att-detail-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:6px;}
.att-detail-area{font-size:11px;color:var(--text3);}
.tag{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.2px;}
.tag-open{background:rgba(52,211,153,.14);color:var(--green);}
.tag-closed{background:rgba(248,113,113,.12);color:var(--red);}
.tag-refurb{background:rgba(167,139,250,.14);color:var(--purple);}
.tag-bg{background:rgba(167,139,250,.18);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
.tag-sr{background:rgba(52,211,153,.18);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.tag-opportunity{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3);font-weight:700;}
.tag-above{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);font-weight:700;}
.tag-area{background:rgba(77,159,255,.1);color:var(--blue);}
.att-bot{display:flex;align-items:center;gap:8px;}
/* Painel de previsao expandido — layout horizontal */
.forecast-panel{display:none;margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);}
.forecast-panel.open{display:block;}
.forecast-panel-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
/* Linha por hora */
.fc-row{display:flex;align-items:center;gap:8px;padding:3px 0;}
.fc-row-now{background:rgba(240,180,41,.06);border-radius:6px;padding:4px 6px;margin:0 -6px;}
.fc-row-hour{font-size:11px;font-weight:600;color:var(--text3);min-width:36px;flex-shrink:0;}
.fc-row-now .fc-row-hour{color:var(--gold);}
.fc-now-badge{font-size:8px;background:var(--gold);color:#0f1118;border-radius:4px;padding:1px 4px;margin-left:3px;font-weight:700;}
.fc-row-bar-wrap{flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden;}
.fc-row-bar{height:100%;border-radius:3px;transition:width .4s ease;}
.fc-row-val{font-size:11px;font-weight:700;min-width:42px;text-align:right;flex-shrink:0;}
/* Area pin inline no nome */
.att-area-pin{font-size:10px;color:var(--text3);font-weight:400;margin-left:4px;white-space:nowrap;}
.btn-sm{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.btn-sm.bell-on{background:rgba(240,180,41,.1);border-color:var(--gold);color:var(--gold);}
.btn-sm.check-on{background:rgba(52,211,153,.12);border-color:var(--green);color:var(--green);}
.btn-maps{width:32px;height:32px;border-radius:9px;border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.08);color:var(--green);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;text-decoration:none;}
.btn-maps:active{background:rgba(52,211,153,.2);}

/* --- SHOW CARD (aba shows) --- */
.show-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;gap:12px;transition:opacity .25s;}
.show-card.past{opacity:.3;}
.show-card.soon{border-color:rgba(240,180,41,.3);background:linear-gradient(135deg,rgba(240,180,41,.05) 0%,var(--surface) 100%);}
.sc-left{text-align:center;min-width:50px;flex-shrink:0;}
.sc-time{font-size:15px;font-weight:700;color:var(--text);line-height:1;}
.sc-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px;}
.sc-cd{font-size:11px;color:var(--gold);font-weight:600;margin-top:6px;}
.sc-right{flex:1;min-width:0;}
.sc-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.3;}
.sc-pills{display:flex;flex-wrap:wrap;gap:5px;}
.spill{background:var(--surface2);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text2);}
.spill.next{background:rgba(240,180,41,.14);color:var(--gold);font-weight:600;}
.spill.past{opacity:.3;}

/* --- OCUPACAO --- */
.ocupacao-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:8px;}

/* Gauge SVG */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px;}
.gauge-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);}
.gauge-val{font-size:28px;font-weight:700;line-height:1;}
.gauge-sub{font-size:11px;color:var(--text2);}
.gauge-trend{font-size:12px;font-weight:600;margin-top:2px;}

/* Barra de tendencia */
.trend-bar-wrap{margin-bottom:14px;}
.trend-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.trend-hours{display:flex;align-items:flex-end;gap:3px;height:52px;padding-bottom:18px;}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;height:100%;}
.trend-bar-bg{width:100%;flex:1;background:var(--surface2);border-radius:3px 3px 0 0;position:relative;overflow:hidden;min-height:4px;}
.trend-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 0 0;transition:height .5s ease;}
.trend-h{font-size:8px;color:var(--text3);text-align:center;margin-top:4px;flex-shrink:0;}
.trend-h.now{color:var(--gold);font-weight:700;}

/* Ranking oportunidade */
.opp-list{display:flex;flex-direction:column;gap:6px;}
.opp-row{display:flex;align-items:center;gap:10px;}
.opp-rank{font-size:10px;color:var(--text3);min-width:16px;text-align:right;flex-shrink:0;}
.opp-name{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.opp-bar-wrap{width:80px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;flex-shrink:0;}
.opp-bar-fill{height:100%;border-radius:3px;}
.opp-pct{font-size:11px;font-weight:700;min-width:32px;text-align:right;flex-shrink:0;}
.opp-delta{font-size:10px;min-width:40px;text-align:right;flex-shrink:0;}

/* Areas */
.areas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.area-card{background:var(--surface2);border-radius:10px;padding:10px 12px;}
.area-name{font-size:10px;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.area-gauge-wrap{position:relative;height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.area-gauge-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.area-pct{font-size:15px;font-weight:700;}
.area-count{font-size:10px;color:var(--text3);margin-top:1px;}
.early-banner{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(77,159,255,.12) 0%,rgba(77,159,255,.04) 100%);border:1px solid rgba(77,159,255,.3);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
/* Closing banner */
.closing-banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;margin-bottom:8px;font-size:13px;font-weight:500;}
.closing-banner.urgent{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);}
.closing-banner.warn{background:rgba(251,146,60,.10);border:1px solid rgba(251,146,60,.25);color:var(--orange);}
.closing-banner.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:var(--green);}
/* Event banner */
.event-banner{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;margin-bottom:8px;font-size:12px;line-height:1.5;}
.event-banner.party{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:var(--purple);}
.event-banner.special{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);color:var(--orange);}
/* Early entry badge na home */
.park-early-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--blue);background:rgba(77,159,255,.1);border:1px solid rgba(77,159,255,.2);border-radius:5px;padding:2px 7px;margin-top:4px;}
/* Countdown no header */
.ph-closing{font-size:10px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:4px;}
.ph-closing.urgent{background:rgba(248,113,113,.15);color:var(--red);}
.ph-closing.warn{background:rgba(251,146,60,.12);color:var(--orange);}
.ph-closing.ok{background:rgba(52,211,153,.1);color:var(--green);}
.early-icon{font-size:22px;flex-shrink:0;margin-top:1px;}
.early-body{flex:1;}
.early-title{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:2px;}
.early-hours{font-size:18px;font-weight:700;color:var(--text);margin-bottom:3px;}
.early-note{font-size:11px;color:var(--text2);}
.hours-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
.hours-icon{font-size:16px;}
.party-note-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--orange);line-height:1.4;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);border-radius:12px;padding:10px 14px;margin-bottom:8px;}

/* --- MODAL --- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;padding:22px 20px 44px;width:100%;max-width:480px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--surface2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.5;}
.modal-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;}
.thresh-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.thresh-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--surface2);border-radius:2px;outline:none;}
.thresh-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);cursor:pointer;}
.thresh-val{font-size:19px;font-weight:700;color:var(--gold);min-width:54px;text-align:right;}
.modal-btns{display:flex;gap:9px;}
.mbtn{flex:1;padding:13px;border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.mbtn-cancel{background:var(--surface2);color:var(--text2);}
.mbtn-save{background:var(--gold);color:#0f1118;}
.mbtn-remove{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3);}

/* --- MISC --- */
.ticker{text-align:center;font-size:11px;color:var(--text3);padding:10px 0 4px;}
.empty{text-align:center;padding:32px 20px;color:var(--text3);}
.empty-icon{font-size:32px;margin-bottom:8px;}
.empty-text{font-size:13px;}

/* --- WEATHER WIDGET --- */
.weather-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
.weather-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.weather-icon{font-size:32px;flex-shrink:0;line-height:1;}
.weather-info{flex:1;}
.weather-temp{font-size:24px;font-weight:700;color:var(--text);line-height:1;}
.weather-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.weather-daily-summary{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.5;background:var(--surface2);border:1px solid var(--border);}
/* --- RAIN WINDOW BANNER --- */
.rain-window-banner{display:none;margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid rgba(251,146,60,.35);background:linear-gradient(135deg,rgba(251,146,60,.12) 0%,var(--surface) 100%);}
.rain-window-banner.active{display:block;}
.rwb-top{display:flex;align-items:center;gap:12px;padding:12px 14px 8px;}
.rwb-icon{font-size:28px;flex-shrink:0;}
.rwb-meta{flex:1;}
.rwb-title{font-size:13px;font-weight:700;color:var(--orange);}
.rwb-sub{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4;}
.rwb-cd{text-align:center;flex-shrink:0;}
.rwb-cd-num{font-size:26px;font-weight:700;color:var(--orange);line-height:1;}
.rwb-cd-unit{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
.rwb-rides{padding:0 14px 12px;display:flex;flex-direction:column;gap:5px;}
.rwb-ride{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:8px;padding:7px 10px;}
.rwb-ride-name{font-size:12px;font-weight:500;color:var(--text);}
.rwb-ride-wait{font-size:13px;font-weight:700;color:var(--green);}
.rwb-dismiss{display:block;text-align:center;font-size:11px;color:var(--text3);padding:0 14px 10px;cursor:pointer;}
.weather-daily-summary strong{font-weight:600;color:var(--text);display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.weather-daily-periods{display:flex;gap:6px;margin-bottom:10px;}
.wdp{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center;}
.wdp-label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px;}
.wdp-icon{font-size:18px;line-height:1;margin-bottom:3px;}
.wdp-temp{font-size:12px;font-weight:700;color:var(--text);}
.wdp-rain{font-size:10px;color:var(--blue);margin-top:1px;}
.weather-rain-alert.heavy{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3);color:var(--red);}
.weather-ctx-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.wctx{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;}
.wctx.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:var(--green);}
.wctx.warn{background:rgba(251,146,60,.09);border:1px solid rgba(251,146,60,.25);color:var(--orange);}
.wctx.danger{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.3);color:var(--red);}
.wctx.info{background:rgba(77,159,255,.09);border:1px solid rgba(77,159,255,.22);color:var(--blue);}
.wctx-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.wctx-body{flex:1;}
.wctx-label{font-weight:600;margin-bottom:1px;}
.wctx-desc{opacity:.85;}
.weather-hourly{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.weather-hourly::-webkit-scrollbar{display:none;}
.wh-col{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:38px;}
.wh-hour{font-size:9px;color:var(--text3);text-transform:uppercase;}
.wh-hour.now{color:var(--gold);font-weight:700;}
.wh-icon{font-size:14px;line-height:1;}
.wh-temp{font-size:11px;font-weight:600;color:var(--text);}
.wh-rain{font-size:9px;color:var(--blue);}
.wh-col.rain-warn .wh-hour,.wh-col.rain-warn .wh-temp{color:var(--blue);}
.wh-col.rain-heavy .wh-hour,.wh-col.rain-heavy .wh-temp{color:var(--red);}

/* --- PARADE & FIREWORKS TRACKER --- */
.pf-card{border-radius:14px;padding:14px 16px;margin-bottom:8px;position:relative;overflow:hidden;}
.pf-card.parade{background:linear-gradient(135deg,rgba(240,180,41,.10) 0%,var(--surface) 100%);border:1px solid rgba(240,180,41,.30);}
.pf-card.fireworks{background:linear-gradient(135deg,rgba(167,139,250,.12) 0%,var(--surface) 100%);border:1px solid rgba(167,139,250,.30);}
.pf-card.show-event{background:linear-gradient(135deg,rgba(52,211,153,.08) 0%,var(--surface) 100%);border:1px solid rgba(52,211,153,.25);}
.pf-top{display:flex;align-items:center;gap:12px;}
.pf-icon{font-size:28px;flex-shrink:0;}
.pf-meta{flex:1;min-width:0;}
.pf-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pf-area{font-size:11px;color:var(--text3);margin-top:1px;}
.pf-cd-wrap{text-align:center;flex-shrink:0;}
.pf-cd-num{font-size:26px;font-weight:700;line-height:1;}
.pf-cd-unit{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;}
.pf-times{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.pf-pill{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--text2);}
.pf-pill.next{background:rgba(240,180,41,.16);color:var(--gold);font-weight:600;}
.pf-pill.fw-next{background:rgba(167,139,250,.16);color:var(--purple);font-weight:600;}
.pf-pill.past{opacity:.3;}
.pf-now-badge{display:inline-block;font-size:10px;font-weight:700;background:var(--green);color:#fff;border-radius:5px;padding:2px 7px;margin-left:4px;}

/* --- ITINERARY CARD --- */
.itin-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
.itin-title{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.itin-step{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.itin-step:last-child{border-bottom:none;}
.itin-step-num{width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:11px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.itin-step-num.go-now{background:rgba(52,211,153,.18);color:var(--green);}
.itin-step-body{flex:1;min-width:0;}
.itin-step-area{font-size:13px;font-weight:500;color:var(--text);}
.itin-step-pct{font-size:11px;margin-top:2px;}
.itin-step-tip{font-size:11px;color:var(--text2);line-height:1.4;margin-top:3px;}
.itin-note{font-size:11px;color:var(--text2);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
/* --- ROTEIRO EM TEMPO REAL --- */
.rt-gps-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2);border-radius:12px;margin-bottom:12px;font-size:12px;}
.rt-gps-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rt-gps-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.2);}
.rt-gps-dot.off{background:var(--text3);}
.rt-gps-label{flex:1;color:var(--text2);}
.rt-gps-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}
.rt-location-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-bottom:14px;}
.rt-location-bar i{font-size:12px;}
.rt-timeline{display:flex;flex-direction:column;gap:0;}
.rt-step{display:flex;gap:12px;position:relative;}
.rt-step-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:32px;}
.rt-step-node{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;z-index:1;}
.rt-step-node.current{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(77,159,255,.2);}
.rt-step-node.next{background:var(--surface2);color:var(--text);border:2px solid var(--border);}
.rt-step-node.anchor{background:rgba(167,139,250,.15);color:var(--purple);border:2px solid rgba(167,139,250,.4);}
.rt-step-connector{width:2px;flex:1;background:var(--border);margin:2px 0;}
.rt-step:last-child .rt-step-connector{display:none;}
.rt-step-body{flex:1;padding-bottom:16px;min-width:0;}
.rt-step-time{font-size:10px;color:var(--text3);margin-bottom:3px;letter-spacing:.3px;}
.rt-step-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.rt-step-card.current{border-color:var(--blue);background:rgba(77,159,255,.05);}
.rt-step-card.anchor{border-color:rgba(167,139,250,.4);}
.rt-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.rt-card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.rt-card-area{font-size:11px;color:var(--text3);margin-top:2px;}
.rt-card-right{text-align:right;flex-shrink:0;}
.rt-card-wait{font-size:20px;font-weight:700;line-height:1;}
.rt-card-wait-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.rt-card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rt-meta-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);background:var(--surface2);border-radius:6px;padding:3px 8px;}
.rt-card-actions{display:flex;gap:8px;margin-top:10px;}
.rt-btn{font-size:11px;font-family:inherit;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;}
.rt-btn-done{background:rgba(52,211,153,.15);color:var(--green);}
.rt-btn-skip{background:var(--surface2);color:var(--text2);}
.rt-trend-up{color:var(--red);}
.rt-trend-down{color:var(--green);}
.rt-empty{text-align:center;padding:32px 20px;color:var(--text3);}
.rt-empty-icon{font-size:36px;margin-bottom:10px;}
.rt-summary-bar{display:flex;gap:8px;margin-bottom:14px;}
.rt-summary-pill{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;}
.rt-summary-val{font-size:17px;font-weight:700;color:var(--text);}
.rt-summary-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:1px;}
.rt-epcot-only{display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:11px;color:var(--green);}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-castle">&#127984;</div>
  <div class="ld-text">Carregando magia...</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<div id="toast">
  <span>&#128276;</span>
  <span id="toast-text"></span>
  <span class="t-close" onclick="dismissToast()">&#10005;</span>
</div>

<div id="app">
  <div class="router" id="router">

    <!-- HOME VIEW -->
    <div class="view" id="view-home">
      <div class="stars"></div>
      <div class="home-scroll">
        <div class="home-hero">
          <div class="home-hero-inner">
            <div class="home-hero-topbar">
              <button class="btn-refresh-all" id="btn-ra" onclick="refreshAllParks()">
                <span class="ri">&#8635;</span> Atualizar
              </button>
              <button class="theme-pill" onclick="toggleTheme()">
                <span class="ti ti-moon">&#127769;</span>
                <span class="ti ti-sun">&#9728;&#65039;</span>
              </button>
            </div>
            <div class="home-disney-logo" id="home-disney-logo"></div>
            <div class="home-sub">Dados em tempo real &middot; Orlando, FL</div>
          </div>
        </div>
        <div id="home-weather" style="width:100%;max-width:480px;padding:14px 16px 0;box-sizing:border-box;"></div>
        <div class="park-list" id="park-list"></div>
        <div class="home-footer" id="home-ticker">&#8212;</div>
      </div>
    </div>

    <!-- PARK VIEW -->
    <div class="view" id="view-park">
      <div class="park-header">
        <div class="ph-inner">
          <div class="ph-top">
            <button class="btn-back" onclick="goHome()">&#8592;</button>
            <div class="ph-meta">
              <div class="ph-name" id="ph-name">&#8212;</div>
              <div class="ph-status">
                <span class="ph-dot"></span>
                <span id="ph-hours">Carregando...</span>
                <span id="ph-closing" class="ph-closing" style="display:none"></span>
              </div>
            </div>
            <div class="ph-actions">
              <button class="btn-icon" id="btn-theme-park" onclick="toggleTheme()">&#9728;&#65039;</button>
              <button class="btn-icon" id="btn-rf" onclick="refreshPark()">&#8635;</button>
            </div>
          </div>
          <div class="tab-bar">
            <button class="tab active" onclick="switchTab('resumo',this)">Resumo</button>
            <button class="tab" onclick="switchTab('atracoes',this)">Atracoes</button>
            <button class="tab" onclick="switchTab('shows',this)">Shows</button>
            <button class="tab" id="tab-roteiro" onclick="switchTab('roteiro',this)" style="display:none">&#128205; Roteiro</button>
          </div>
        </div>
      </div>

      <div class="park-body">
        <!-- RESUMO -->
        <div class="tab-panel active" id="panel-resumo">
          <div class="panel-inner">
            <div id="schedule-banners"></div>
            <!-- Detector de janela de oportunidade pos-chuva -->
            <div id="rain-window-banner" class="rain-window-banner">
              <div class="rwb-top">
                <div class="rwb-icon">🌤️</div>
                <div class="rwb-meta">
                  <div class="rwb-title" id="rwb-title">Janela de oportunidade!</div>
                  <div class="rwb-sub" id="rwb-sub"></div>
                </div>
                <div class="rwb-cd">
                  <div class="rwb-cd-num" id="rwb-cd">--</div>
                  <div class="rwb-cd-unit">min</div>
                </div>
              </div>
              <div class="rwb-rides" id="rwb-rides"></div>
              <span class="rwb-dismiss" onclick="dismissRainWindow()">Dispensar</span>
            </div>
            <!-- Feature 6: Parade & Fireworks Tracker -->
            <div id="pf-section" style="display:none">
              <div class="sec-label">&#127881; Parade &amp; Fireworks</div>
              <div id="pf-content"></div>
            </div>
            <!-- Feature 7: Roteiro dinamico -->
            <div id="itin-section" style="display:none">
              <div class="sec-label">&#128205; Roteiro sugerido agora</div>
              <div id="itin-content"></div>
            </div>
            <div id="ocupacao-section" style="display:none">
              <div class="sec-label">&#128202; Ocupacao do parque</div>
              <div id="ocupacao-content"></div>
            </div>
            <div class="ticker" id="park-ticker"></div>
          </div>
        </div>

        <!-- ATRACOES -->
        <div class="tab-panel" id="panel-atracoes">
          <div class="panel-inner">
            <div class="sort-row">
              <span class="sort-lbl">Ordenar:</span>
              <button class="sort-btn active" onclick="setSort('asc',this)">&#8593; Menor fila</button>
              <button class="sort-btn" onclick="setSort('desc',this)">&#8595; Maior fila</button>
              <div class="att-search-wrap" style="flex:1;margin-bottom:0;">
                <input class="att-search" id="att-search" type="search" placeholder="&#128269; Buscar..." oninput="onAttSearch(this)" onsearch="onAttSearch(this)">
                <button class="att-search-clear" id="att-search-clear" onclick="clearAttSearch()" title="Limpar">&#10005;</button>
              </div>
            </div>
            <div id="att-list"></div>
          </div>
        </div>

        <!-- SHOWS -->
        <div class="tab-panel" id="panel-shows">
          <div class="panel-inner">
            <div class="sort-row" style="margin-bottom:12px">
              <span class="sort-lbl">Ordenar:</span>

  loadCoords();
}

function loadCoords(){ try{ var c=localStorage.getItem('wdw_coords'); if(c) S.coordCache=JSON.parse(c); }catch(e){} }

/* Busca coordenadas de uma atracao via /entity/{id} — cache 24h */
async function fetchCoords(id) {
  var HOUR24 = 24*3600*1000;
  var cached = S.coordCache[id];
  if(cached && (Date.now()-cached.fetchedAt) < HOUR24) return cached;
  try {
    var r = await fetch('https://api.themeparks.wiki/v1/entity/'+id);
    if(!r.ok) return null;
    var d = await r.json();
    var lat = d.location&&d.location.latitude;
    var lng = d.location&&d.location.longitude;
    if(lat&&lng){
      S.coordCache[id] = {lat:lat, lng:lng, fetchedAt:Date.now()};
      saveCoords();
      return S.coordCache[id];
    }
  } catch(e){}
  return null;
}

/* Pre-carrega coords de todas as atracoes em background (sem bloquear UI) */
async function prefetchCoords(attractions) {
  // Filtra apenas os que nao temos cache valido
  var HOUR24 = 24*3600*1000;
  var missing = attractions.filter(function(e){
    var c = S.coordCache[e.id];
    return !c || (Date.now()-c.fetchedAt) >= HOUR24;
  });
  if(!missing.length) return;
  // Busca em lotes de 5 para nao sobrecarregar a API
  for(var i=0; i<missing.length; i+=5){
    var batch = missing.slice(i, i+5);
    await Promise.allSettled(batch.map(function(e){ return fetchCoords(e.id); }));
  }
  // Re-renderiza atracoes com coords atualizadas
  renderAtt();
}

/* --- THEME --- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme',t);

}
function toggleTheme() { S.theme=S.theme==='dark'?'light':'dark'; applyTheme(S.theme); saveT(); renderDisneyLogo(); }

/* --- HELPERS --- */
function fmt(iso) {
  if(!iso) return '--';
  try { return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York'}); }
  catch(e){ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
}
function minsTo(iso){ return iso?Math.floor((new Date(iso)-Date.now())/60000):null; }
function wColor(w){ if(w==null)return'var(--text3)'; if(w<=20)return'var(--green)'; if(w<=40)return'var(--gold)'; if(w<=60)return'var(--orange)'; return'var(--red)'; }
function bClass(pct){ if(pct<=25)return'low'; if(pct<=55)return'mid'; return'high'; }
function todayStr(){ var t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function isToday(d){ return d===todayStr(); }
function isPast(d){ var t=new Date(); t.setHours(0,0,0,0); return new Date(d)<t; }

/* --- SOUND + TOAST --- */
function beep() {
  try {
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=f; o.type='sine';
      g.gain.setValueAtTime(.25,ctx.currentTime+i*.14);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.14+.38);
      o.start(ctx.currentTime+i*.14); o.stop(ctx.currentTime+i*.14+.38);
    });
  } catch(e){}
}
function toast(msg){
  document.getElementById('toast-text').textContent=msg;
  document.getElementById('toast').classList.add('show');
  beep();
  setTimeout(dismissToast,8000);
}
function dismissToast(){ document.getElementById('toast').classList.remove('show'); }

/* --- ALERTS CHECK --- */
function checkAlerts(ents) {
  if(!S.alerts.length||!S.park) return;
  var now=Date.now();
  S.alerts.forEach(function(al){
    if(al.parkId!==S.park.apiId) return;
    var e=ents.find(function(x){ return x.id===al.entityId; }); if(!e) return;
    if(al.type==='queue'){
      var w=e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime;
      if(w!=null&&w<=al.threshold&&(!al.lastFired||(now-al.lastFired)>600000)){
        al.lastFired=now; saveA();
        toast('\u26A1 '+e.name+': fila em '+w+' min!');
      }
    }
  });
}

  var r=await fetch(API+'/'+apiId+'/live');

  return r.json();

/* --- NAVIGATION --- */
function goHome() {
  clearInterval(S.timers.refresh); clearInterval(S.timers.cd); clearInterval(S.timers.closing);
  document.getElementById('router').classList.remove('on-park');
}

async function selectPark(apiId) {
  S.park=PARKS.find(function(p){ return p.apiId===apiId; });
  S.attSearch='';
  var inp=document.getElementById('att-search'); if(inp) inp.value='';
  var clr=document.getElementById('att-search-clear'); if(clr) clr.classList.remove('visible');
  document.getElementById('ph-name').textContent=S.park.name;
  document.getElementById('ph-hours').textContent='Carregando...';
  switchTab('resumo',document.querySelector('.tab-bar .tab'));
  document.getElementById('router').classList.add('on-park');
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.scrollTop=0; });
  await loadPark();
  clearInterval(S.timers.refresh);
  S.timers.refresh=setInterval(loadPark,REFRESH);
  clearInterval(S.timers.cd);
  S.timers.cd=setInterval(tickCountdowns,30000);
}

function renderDisneyLogo() {
  var el = document.getElementById('home-disney-logo');
  if(!el) return;
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var color = isDark ? '#f0b429' : '#0057A8';
  el.innerHTML = '<span class="logo-disney" style="color:' + color + '">Disney</span>'
    + '<span class="logo-parks" style="color:' + color + '">Parks</span>';
}

function buildHomeSkeleton() {
  renderDisneyLogo();
  document.getElementById('park-list').innerHTML = PARKS.map(function(p) {
    var logo = PARK_LOGOS[p.id] || '';
    return '<div class="park-card" onclick="selectPark(\''+p.apiId+'\')">'
      +'<div class="park-card-body">'
      +'<div class="park-logo-wrap" style="color:'+p.color+';fill:'+p.color+'">'+logo+'</div>'
      +'<div class="park-info">'
      +'<div class="park-hours" id="ph-'+p.id+'"><span class="park-hours-dot"></span>Carregando...</div>'
      +'<div id="early-badge-'+p.id+'" class="park-early-badge" style="display:none">\u2B50 Early Entry</div>'
      +'<div class="park-stats" id="ps-'+p.id+'">'
      +'<div><div class="pstat-val" style="color:'+p.color+'">--</div><div class="pstat-lbl">abertas</div></div>'
      +'<div><div class="pstat-val" style="color:'+p.color+'">--</div><div class="pstat-lbl">shows</div></div>'
      +'</div></div>'
      +'<div class="park-arrow">&#8250;</div>'
      +'</div></div>';
  }).join('');
}

async function loadHomePark(p) {
  try {
    var d=await fetchPark(p.apiId);
    var ents=d.liveData||[];
    var open=ents.filter(function(e){ return e.entityType==='ATTRACTION'&&e.status==='OPERATING'&&e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime!=null; });
    var shows=ents.filter(function(e){ return e.entityType==='SHOW'&&e.showtimes&&e.showtimes.length>0; });

    // Detecta horario e status do parque
    var hrs='Horario indisponivel';
    var parkOpen = false;
    var closingTime = null;
    for(var i=0;i<ents.length;i++){
      var ent=ents[i]; if(!ent.operatingHours||!ent.operatingHours.length) continue;
      var op=ent.operatingHours.find(function(h){
        var t=(h.type||'').toLowerCase();
        return(t==='operating'||t==='park_hours'||t==='open')&&!t.includes('extra')&&!t.includes('magic')&&!t.includes('early');
      });
      if(op){
        hrs=fmt(op.startTime)+' \u2013 '+fmt(op.endTime);
        closingTime = op.endTime;
        // Parque aberto se agora esta entre abertura e fechamento
        var now=new Date();
        var start=new Date(op.startTime);
        var end=new Date(op.endTime);
        parkOpen = now>=start && now<=end;
        break;
      }
    }
    // Fallback: se ha atracoes operando, considera aberto
    if(!closingTime && open.length > 0) parkOpen = true;

    var dotClass = parkOpen ? 'park-hours-dot' : 'park-hours-dot closed';
    var statusLabel = parkOpen ? hrs : 'Fechado &middot; ' + hrs;
    document.getElementById('ph-'+p.id).innerHTML='<span class="'+dotClass+'"></span>'+statusLabel;

    document.getElementById('ps-'+p.id).innerHTML=
      '<div><div class="pstat-val" style="color:'+p.color+'">'+open.length+'</div><div class="pstat-lbl">abertas</div></div>'
      +'<div><div class="pstat-val" style="color:'+p.color+'">'+shows.length+'</div><div class="pstat-lbl">shows</div></div>';
  } catch(e) {
    var el=document.getElementById('ph-'+p.id);
    if(el) el.textContent='Erro ao carregar';
  }
}

async function refreshAllParks() {
  var btn=document.getElementById('btn-ra'); btn.classList.add('spinning');
  buildHomeSkeleton();
  renderHomeWeather();
  await Promise.allSettled(PARKS.map(function(p){ return loadHomePark(p); }));
  btn.classList.remove('spinning');
  document.getElementById('home-ticker').textContent='Atualizado as '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* --- PARK DATA --- */
async function loadPark() {
  var btn=document.getElementById('btn-rf'); btn.classList.add('spinning');
  try {
    var d=await fetchPark(S.park.apiId);
    var ents=d.liveData||[];
    S.live=ents;
    S.att=ents.filter(function(e){ return e.entityType==='ATTRACTION'; });
    S.shows=ents.filter(function(e){ return e.entityType==='SHOW'&&e.showtimes&&e.showtimes.length>0; });
    checkAlerts(ents);
    renderHeader(); renderResumo(); renderAtt(); renderShows(); renderRoteiro();
    renderWeather();
    snapshotQueues();
    detectRainWindow();
    document.getElementById('park-ticker').textContent='Atualizado as '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' - proxima em 5 min';
    prefetchCoords(S.att.concat(S.shows));
    // #2, #3, #1, #5, #7 — carrega schedule do dia
    loadTodaySchedule();
  } catch(e) {
    document.getElementById('park-ticker').textContent='Erro ao carregar. Tente novamente.';
  }
  btn.classList.remove('spinning');
}

async function refreshPark() {
  clearInterval(S.timers.refresh); await loadPark();
  S.timers.refresh=setInterval(loadPark,REFRESH);
}

function renderHeader() {
  var ops=S.live.filter(function(e){
    if(!e.operatingHours||!e.operatingHours.length) return false;
    return e.operatingHours.some(function(h){
      var t=(h.type||'').toLowerCase();
      return(t==='operating'||t==='park_hours'||t==='open')&&!t.includes('extra')&&!t.includes('magic')&&!t.includes('early');
    });
  });
  if(ops.length){
    var op=ops[0].operatingHours.find(function(h){
      var t=(h.type||'').toLowerCase();
      return(t==='operating'||t==='park_hours'||t==='open')&&!t.includes('extra')&&!t.includes('magic')&&!t.includes('early');
    });
    if(op){ document.getElementById('ph-hours').textContent=fmt(op.startTime)+' - '+fmt(op.endTime); return; }
  }
  var anyH=S.live.find(function(e){ return e.operatingHours&&e.operatingHours.some(function(h){ return h.type==='Operating'; }); });
  if(anyH){
    var op2=anyH.operatingHours.find(function(h){ return h.type==='Operating'; });
    if(op2) document.getElementById('ph-hours').textContent=fmt(op2.startTime)+' - '+fmt(op2.endTime);
  }
}

/* --- OCUPACAO --- */
function pctColor(p){
  if(p<=30) return 'var(--green)';
  if(p<=55) return 'var(--gold)';
  if(p<=75) return 'var(--orange)';
  return 'var(--red)';
}
function pctLabel(p){
  if(p<=30) return 'Tranquilo';
  if(p<=55) return 'Moderado';
  if(p<=75) return 'Movimentado';
  return 'Muito cheio';
}

function renderOcupacao() {
  var el=document.getElementById('ocupacao-section');
  var cont=document.getElementById('ocupacao-content');
  if(!el||!cont) return;

  // Pega atracoes com forecast e status OPERATING
  var attsWithFc=S.att.filter(function(e){
    return e.status==='OPERATING'&&e.forecast&&e.forecast.length>0;
  });
  if(!attsWithFc.length){ el.style.display='none'; return; }

  var nowH=new Date().getHours();

  // Pega percentage atual de cada atracao
  function getCurrentPct(e){
    var fc=e.forecast.find(function(f){ return new Date(f.time).getHours()===nowH; });
    if(!fc) fc=e.forecast[0];
    return fc?fc.percentage:null;
  }
  function getWaitTimeForecast(e){
    var fc=e.forecast.find(function(f){ return new Date(f.time).getHours()===nowH; });
    return fc?fc.waitTime:null;
  }

  // 1. Ocupacao geral — media dos percentage atuais
  var pcts=attsWithFc.map(getCurrentPct).filter(function(p){ return p!=null; });
  var avgPct=pcts.length?Math.round(pcts.reduce(function(a,b){return a+b;},0)/pcts.length):0;

  // 2. Tendencia — proximas 3h vs hora atual
  var futureHours=[];
  for(var h=0;h<6;h++){
    var targetH=(nowH+h)%24;
    var hourPcts=attsWithFc.map(function(e){
      var fc=e.forecast.find(function(f){ return new Date(f.time).getHours()===targetH; });
      return fc?fc.percentage:null;
    }).filter(function(p){ return p!=null; });
    if(hourPcts.length){
      futureHours.push({
        h:targetH,
        pct:Math.round(hourPcts.reduce(function(a,b){return a+b;},0)/hourPcts.length),
        isNow:h===0
      });
    }
  }
  var trend3h=futureHours.slice(1,4);
  var avgFuture=trend3h.length?Math.round(trend3h.reduce(function(a,b){return a+b.pct;},0)/trend3h.length):avgPct;
  var trendDelta=avgFuture-avgPct;
  var trendLabel=trendDelta>8?'\u2191 Tendencia de alta':trendDelta<-8?'\u2193 Tendencia de queda':'\u2192 Estavel';
  var trendColor=trendDelta>8?'var(--red)':trendDelta<-8?'var(--green)':'var(--text2)';

  // 3. Ranking de oportunidade — menor percentage atual vs forecast
  var ranked=attsWithFc.map(function(e){
    var curPct=getCurrentPct(e);
    var curWait=e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime;
    var fcWait=getWaitTimeForecast(e);
    var delta=fcWait!=null&&curWait!=null?curWait-fcWait:0;
    return{e:e,pct:curPct||0,curWait:curWait,delta:delta};
  })
  .filter(function(x){ return x.pct!=null&&x.curWait!=null; })
  .sort(function(a,b){ return a.pct-b.pct; })
  .slice(0,5);

  // 4. Distribuicao por area
  var areaMap={};
  attsWithFc.forEach(function(e){
    var sd=getStatic(e);
    var area=sd&&sd.area?sd.area.split(' - ')[0].split(':')[0].trim():'Outros';
    if(!areaMap[area]) areaMap[area]={pcts:[],count:0};
    var p=getCurrentPct(e);
    if(p!=null){ areaMap[area].pcts.push(p); areaMap[area].count++; }
  });
  var areas=Object.keys(areaMap).map(function(a){
    var ps=areaMap[a].pcts;
    return{name:a,pct:ps.length?Math.round(ps.reduce(function(x,y){return x+y;},0)/ps.length):0,count:areaMap[a].count};
  }).sort(function(a,b){return a.pct-b.pct;});

  // ── RENDER ──
  var html='';

  // GAUGE PRINCIPAL
  var gaugeR=54;
  var circumference=Math.PI*gaugeR;
  var dashOffset=circumference*(1-avgPct/100);
  var gaugeDesc=avgPct<=30
    ?'O parque esta bem abaixo do normal para este horario. Otimo momento para aproveitar as atracoes.'
    :avgPct<=55
    ?'Movimento moderado. Filas dentro do esperado para este dia e horario.'
    :avgPct<=75
    ?'Parque mais cheio que o habitual. Planeje bem a ordem das atracoes.'
    :'Proximo do pico historico. Priorize Lightning Lane e atracoes menos populares.';

  html+='<div class="ocupacao-card">'
    +'<div class="gauge-wrap">'
    +'<div class="gauge-label">Comparado ao historico de dias similares</div>'
    +'<svg width="140" height="80" viewBox="0 0 140 80">'
    +'<path d="M 16 70 A '+gaugeR+' '+gaugeR+' 0 0 1 124 70" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="M 16 70 A '+gaugeR+' '+gaugeR+' 0 0 1 124 70" fill="none"'
    +' stroke="'+pctColor(avgPct)+'" stroke-width="10" stroke-linecap="round"'
    +' stroke-dasharray="'+circumference+'" stroke-dashoffset="'+dashOffset+'"'
    +' style="transition:stroke-dashoffset .8s ease,stroke .4s ease"/>'
    +'<text x="70" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="'+pctColor(avgPct)+'">'+avgPct+'%</text>'
    +'</svg>'
    +'<div class="gauge-val-label" style="font-size:13px;font-weight:600;color:'+pctColor(avgPct)+';margin-bottom:4px">'+pctLabel(avgPct)+'</div>'
    +'<div style="font-size:11px;color:var(--text2);text-align:center;line-height:1.5;padding:0 8px">'+gaugeDesc+'</div>'
    +'<div class="gauge-trend" style="color:'+trendColor+';margin-top:8px">'+trendLabel+' nas proximas 3h</div>'
    +'</div>'

    // BARRA DE TENDENCIA
    +'<div class="trend-bar-wrap" style="margin-top:14px">'
    +'<div class="trend-label">Projecao de movimento por hora</div>'
    +'<div style="font-size:10px;color:var(--text3);margin-bottom:6px">Quanto mais alta a barra, mais cheio o parque tende a estar</div>'
    +'<div class="trend-hours">'
    +futureHours.map(function(fh){
      var barH=Math.max(Math.round(fh.pct*0.34),3); // max 34px (de 52px - 18px labels)
      var glow=fh.isNow?'box-shadow:0 0 6px '+pctColor(fh.pct)+';':'' ;
      return '<div class="trend-col">'
        +'<div class="trend-bar-bg"><div class="trend-bar-fill" style="height:'+barH+'px;background:'+pctColor(fh.pct)+';'+glow+'"></div></div>'
        +'<div class="trend-h '+(fh.isNow?'now':'')+'">'+(fh.isNow?'agora':fh.h+'h')+'</div>'
        +'</div>';
    }).join('')
    +'</div></div>'
    +'</div>';

  // RANKING DE OPORTUNIDADE

function trend(e) {
  if(!e.forecast||!e.forecast.length) return '';
  var nowH=new Date().getHours();
  var fut=e.forecast.filter(function(f){ return new Date(f.time).getHours()>nowH; }).slice(0,3);
  if(!fut.length) return '';
  var avg=Math.round(fut.reduce(function(s,f){ return s+f.waitTime; },0)/fut.length);
  var cur=e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime;
  if(cur==null) return '';
  if(avg>cur+10) return '\u2191 deve subir para ~'+avg+' min';
  if(avg<cur-10) return '\u2193 deve cair para ~'+avg+' min';
  return '\u2192 estavel ~'+avg+' min';
}

  if(bg){ var bgl=bg.allocationStatus==='AVAILABLE'?'\uD83C\uDF9F Grupo '+bg.currentGroupStart+'-'+bg.currentGroupEnd:bg.allocationStatus==='PAUSED'?'\u23F8 BG pausado':'\uD83C\uDF9F BG ativo'; bgtag='<span class="tag tag-bg">'+bgl+'</span>'; if(bg.nextAllocationTime){var mn=minsTo(bg.nextAllocationTime);if(mn!=null&&mn>=0&&mn<=60) bgtag+='<span class="tag tag-bg">\uD83D\uDD50 Prox. alocacao em '+mn+'min</span>';} }

  // Single Rider
  var srtag='';

  if(sr&&sr.waitTime!=null){
    srtag='<span class="tag tag-sr">SR: '+sr.waitTime+' min</span>';
  } else if(sr&&sr.waitTime===null&&e.status==='OPERATING'){
    srtag='<span class="tag tag-sr">SR: aberto</span>';
  }

  var sd=getStatic(e);
  var areaPin=sd&&sd.area?' <span class="att-area-pin">\uD83D\uDCCD '+sd.area+'</span>':'';
  var wHtml='';
  if(e.status==='REFURBISHMENT') wHtml='<div style="font-size:20px">\uD83D\uDD27</div>';
  else if(w!=null) wHtml='<div class="att-num" style="color:'+wColor(w)+'">'+w+'</div><div class="att-unit">min</div>';
  else if(e.status==='OPERATING') wHtml='<div style="font-size:10px;color:var(--text3);text-align:center;line-height:1.3">walk<br>in</div>';
  else wHtml='<div style="font-size:20px;opacity:.2">--</div>';

  // Badge de oportunidade / alerta
  var opportunityBadge='';
  if(w!=null&&e.forecast&&e.forecast.length){
    var nowH2=new Date().getHours();
    var fcNow=e.forecast.find(function(f){ return new Date(f.time).getHours()===nowH2; });
    if(fcNow&&fcNow.waitTime>0){
      if(w<fcNow.waitTime*0.8){
        opportunityBadge='<span class="tag tag-opportunity">\u2193 Abaixo do esperado</span>';
      } else if(w>fcNow.waitTime*1.2){
        opportunityBadge='<span class="tag tag-above">\u2191 Acima do esperado</span>';
      }
    }
  }

  var forecastPanel='';
  if(e.forecast&&e.forecast.length){
    var nowH=new Date().getHours();
    var futureFc=e.forecast.filter(function(f){ var h=new Date(f.time).getHours(); return h>=nowH; }).slice(0,6);
    if(!futureFc.length) futureFc=e.forecast.slice(-6);
    var mx=Math.max.apply(null,futureFc.map(function(f){ return f.waitTime; }).concat([1]));
    var rows2=futureFc.map(function(f){

        +'<div class="fc-row-val" style="color:'+wColor(f.waitTime)+'">'+f.waitTime+' min</div>'
        +'</div>';

    forecastPanel='<div class="forecast-panel open" id="fp-'+e.id+'">'
      +'<div class="forecast-panel-title">Previsao de fila \u2014 proximas horas</div>'

/* --- SCHEDULE --- */
async function fetchTodaySchedule(park) {
  var now=new Date();
  var year=now.getFullYear();
  var month=String(now.getMonth()+1).padStart(2,'0');
  var cacheKey=park.apiId+'_'+year+'_'+month;
  var cached=S.scheduleCache[cacheKey];
  if(cached&&(Date.now()-cached.fetchedAt)<30*60*1000) return cached.data; // cache 30min
  try {
    var r=await fetch('https://api.themeparks.wiki/v1/entity/'+park.apiId+'/schedule/'+year+'/'+month);
    if(!r.ok) return null;
    var d=await r.json();
    var raw=Array.isArray(d)?d:Array.isArray(d.schedule)?d.schedule:[];
    S.scheduleCache[cacheKey]={fetchedAt:Date.now(),data:raw};
    return raw;
  } catch(e){ return null; }
}

function getTodayEntry(scheduleData) {
  if(!scheduleData||!scheduleData.length) return null;
  var today=todayStr();
  // Pega TODAS as entradas do dia
  var entries=scheduleData.filter(function(e){
    var d=e.date||(e.openingTime?e.openingTime.substring(0,10):null);
    return d&&d.substring(0,10)===today;
  });
  if(!entries.length) return null;
  // Entrada principal = Operating (horario regular do parque)
  var operating=entries.find(function(e){
    var t=(e.type||'').toUpperCase();
    return t==='OPERATING'||t==='PARK_HOURS'||t==='OPEN';
  })||entries.find(function(e){
    // fallback: entrada sem tipo especial
    var t=(e.type||'').toUpperCase();
    return !t.includes('TICKETED')&&!t.includes('EXTRA')&&!t.includes('EARLY')&&!t.includes('SPECIAL');
  })||entries[entries.length-1]; // ultimo fallback
  // Retorna a entrada principal com as demais como _extras
  if(operating) operating._extras=entries.filter(function(e){ return e!==operating; });
  return operating;
}

function getEarlyEntry(scheduleData) {
  if(!scheduleData||!scheduleData.length) return null;
  var today=todayStr();
  var entries=scheduleData.filter(function(e){
    var d=e.date||(e.openingTime?e.openingTime.substring(0,10):null);
    return d&&d.substring(0,10)===today;
  });
  // Procura entrada de Early Entry entre todas as entradas do dia
  return entries.find(function(e){
    var t=(e.type||'').toUpperCase();
    var desc=(e.description||'').toLowerCase();
    return t==='TICKETED_EVENT'||t==='EXTRA_HOURS'||t.includes('EARLY')||t.includes('EXTRA')||
           desc.includes('early entry')||desc.includes('extra magic');
  })||null;
}

function getSpecialOfType(entry, keywords) {
  if(!entry) return null;
  var specials=entry.special||entry.specialHours||[];
  if(!Array.isArray(specials)) return null;
  return specials.find(function(s){
    var t=(s.type||s.description||'').toLowerCase();
    return keywords.some(function(k){ return t.includes(k); });
  })||null;
}

async function loadTodaySchedule() {
  if(!S.park) return;
  var data=await fetchTodaySchedule(S.park);
  S.todaySchedule=getTodayEntry(data);
  S._todayEarly=getEarlyEntry(data);
  S._todayAllEntries=data;
  renderScheduleBanners();
  startClosingCountdown();
}

function renderScheduleBanners() {
  var el=document.getElementById('schedule-banners');
  if(!el) return;
  var entry=S.todaySchedule;
  var early=S._todayEarly;
  var html='';

  if(!entry&&!early){ el.innerHTML=''; return; }

  // #2 Early Entry — exibe apenas enquanto ainda esta ativo
  if(early&&early.openingTime){
    var earlyOpen=early.openingTime;
    var earlyClose=early.closingTime||(entry&&entry.openingTime);
    var earlyEndMins=minsTo(earlyClose);
    // Mostra apenas se ainda nao terminou (ate 0 min apos o fim)
    if(earlyEndMins===null||earlyEndMins>=0){
      html+='<div class="early-banner">'
        +'<div style="font-size:22px;flex-shrink:0">\u2B50</div>'
        +'<div style="flex:1">'
        +'<div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:2px">Early Entry \u2014 Hospede Disney</div>'
        +'<div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px">'+fmt(earlyOpen)+' \u2013 '+fmt(earlyClose)+'</div>'
        +'<div style="font-size:11px;color:var(--text2)">Acesso antecipado garantido como hospede Disney</div>'
        +'</div></div>';
    }
  } else if(entry&&entry.openingTime) {
    // Fallback: 30 min antes da abertura oficial
    var earlyStart=new Date(new Date(entry.openingTime).getTime()-30*60000);
    var earlyFallbackEndMins=minsTo(entry.openingTime);
    if(earlyFallbackEndMins===null||earlyFallbackEndMins>=0){
      html+='<div class="early-banner">'
        +'<div style="font-size:22px;flex-shrink:0">\u2B50</div>'
        +'<div style="flex:1">'
        +'<div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:2px">Early Entry \u2014 Hospede Disney</div>'
        +'<div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px">'+fmt(earlyStart.toISOString())+' \u2013 '+fmt(entry.openingTime)+'</div>'
        +'<div style="font-size:11px;color:var(--text2)">30 min antes da abertura oficial \u2014 acesso garantido como hospede</div>'
        +'</div></div>';
    }
  }

  // #3 Evento / Festa — detecta entre todas as entradas do dia
  var allEntries=S._todayAllEntries||[];
  var party=allEntries.find(function(e){
    var t=(e.type||'').toUpperCase();
    var desc=(e.description||'').toLowerCase();
    return t==='SPECIAL_TICKETED_EVENT'||desc.includes('halloween party')||
           desc.includes('not-so-scary')||desc.includes('after hours')||
           desc.includes('special event');
  });
  if(party){
    var pname=party.description||party.type||'Evento especial';
    html+='<div class="event-banner party">'
      +'<span style="font-size:18px">\uD83C\uDF83</span>'
      +'<div>'
      +'<div style="font-weight:600;margin-bottom:2px">'+pname+'</div>'
      +'<div>Parque fecha para visitantes regulares as '+fmt(entry&&entry.closingTime)
      +(party.openingTime?' \u2022 Festa: '+fmt(party.openingTime)+' \u2013 '+fmt(party.closingTime):'')+'</div>'
      +'</div></div>';
  }

  // Tambem verifica special[] aninhado na entrada principal (formato alternativo da API)
  if(!party&&entry){
    var nested=getSpecialOfType(entry,['halloween party','not-so-scary','after hours','special ticketed','event']);
    if(nested){
      html+='<div class="event-banner party">'
        +'<span style="font-size:18px">\uD83C\uDF83</span>'
        +'<div>'
        +'<div style="font-weight:600;margin-bottom:2px">'+(nested.type||nested.description||'Evento especial')+'</div>'
        +'<div>Parque fecha as '+fmt(entry.closingTime)+'</div>'
        +'</div></div>';
    }
  }

  // #1 Banner fechamento
  html+='<div id="closing-banner"></div>';
  el.innerHTML=html;
  renderClosingBanner();
}

function renderClosingBanner() {
  var entry=S.todaySchedule;
  var el=document.getElementById('closing-banner');
  if(!el||!entry||!entry.closingTime) return;
  var minsLeft=minsTo(entry.closingTime);
  if(minsLeft===null||minsLeft<0){ el.innerHTML=''; return; }
  var cls=minsLeft<=30?'urgent':minsLeft<=60?'warn':'ok';
  var icon=minsLeft<=30?'\uD83D\uDD34':minsLeft<=60?'\u26A0\uFE0F':'\uD83D\uDFE2';
  var label=minsLeft<=60
    ?'Parque fecha em '+minsLeft+' minuto'+(minsLeft!==1?'s':'')+'!'
    :'Parque aberto ate '+fmt(entry.closingTime)+' ('+minsLeft+' min restantes)';
  el.innerHTML='<div class="closing-banner '+cls+'">'+icon+' '+label+'</div>';
  // Atualiza badge no header
  var phClose=document.getElementById('ph-closing');
  if(phClose){
    if(minsLeft<=60){
      phClose.textContent=minsLeft+'min';
      phClose.className='ph-closing '+cls;
      phClose.style.display='inline';
    } else {
      phClose.style.display='none';
    }
  }
}

function startClosingCountdown() {
  clearInterval(S.timers.closing);
  renderClosingBanner();
  S.timers.closing=setInterval(function(){
    renderClosingBanner();
    // Re-renderiza banners para ocultar Early Entry apos termino
    renderScheduleBanners();
  },60000);
}

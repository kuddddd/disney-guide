/* ============================================================
   FEATURE 5 — CLIMA EM TEMPO REAL (Open-Meteo, sem chave)
   Orlando: lat 28.3772, lon -81.5707
   ============================================================ */
async function fetchWeather() {
  var CACHE_MS = 10 * 60 * 1000; // 10 min
  if(S.weather && (Date.now() - S.weatherFetchedAt) < CACHE_MS) return S.weather;
  try {
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=28.3772&longitude=-81.5707'
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,'
      +          'weather_code,precipitation_probability,wind_gusts_10m,uv_index'
      + '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,'
      +         'precipitation_probability,thunderstorm_probability,'
      +         'weather_code,wind_gusts_10m,uv_index,cloud_cover,visibility'
      + '&timezone=America%2FNew_York&forecast_days=1&temperature_unit=celsius'
      + '&wind_speed_unit=kmh';
    var r = await fetch(url);
    if(!r.ok) throw new Error('weather fail');
    var d = await r.json();
    S.weather = d;
    S.weatherFetchedAt = Date.now();
    return d;
  } catch(e) { return null; }
}

function weatherIcon(code) {
  if(code === 0) return '\u2600\uFE0F';
  if(code <= 2)  return '\u26C5';
  if(code <= 3)  return '\u2601\uFE0F';
  if(code <= 48) return '\uD83C\uDF2B\uFE0F';
  if(code <= 57) return '\uD83C\uDF26\uFE0F';
  if(code <= 67) return '\uD83C\uDF27\uFE0F';
  if(code <= 77) return '\uD83C\uDF28\uFE0F';
  if(code <= 82) return '\uD83C\uDF26\uFE0F';
  if(code <= 86) return '\u2744\uFE0F';
  if(code <= 99) return '\u26C8\uFE0F';
  return '\uD83C\uDF21\uFE0F';
}
function weatherDesc(code) {
  if(code === 0)  return 'Ceu limpo';
  if(code <= 2)   return 'Parcialmente nublado';
  if(code <= 3)   return 'Nublado';
  if(code <= 48)  return 'Neblina';
  if(code <= 57)  return 'Garoa';
  if(code <= 67)  return 'Chuva';
  if(code <= 77)  return 'Neve';
  if(code <= 82)  return 'Aguaceiros';
  if(code <= 86)  return 'Neve forte';
  if(code <= 99)  return 'Tempestade';
  return 'Clima variavel';
}

/* Monta um bloco de contexto padronizado */
function wctxBlock(level, icon, label, desc) {
  // level: 'ok' | 'warn' | 'danger' | 'info'
  return '<div class="wctx ' + level + '">'
    + '<div class="wctx-icon">' + icon + '</div>'
    + '<div class="wctx-body">'
    + '<div class="wctx-label">' + label + '</div>'
    + '<div class="wctx-desc">' + desc + '</div>'
    + '</div></div>';
}

async function renderHomeWeather() {
  var cont = document.getElementById('home-weather');
  if(!cont) return;

  var d = await fetchWeather();
  if(!d || !d.current) { cont.innerHTML = ''; return; }

  var nowH    = new Date().getHours();
  var cur     = d.current;
  var temp    = Math.round(cur.temperature_2m);
  var feels   = Math.round(cur.apparent_temperature);
  var humidity= Math.round(cur.relative_humidity_2m);
  var code    = cur.weather_code;
  var gusts   = Math.round(cur.wind_gusts_10m || 0);
  var uvNow   = Math.round(cur.uv_index || 0);

  var hours = (d.hourly.time || []).map(function(t, i) {
    return {
      h:       new Date(t).getHours(),
      temp:    Math.round(d.hourly.temperature_2m[i]),
      rain:    d.hourly.precipitation_probability[i] || 0,
      storm:   d.hourly.thunderstorm_probability ? (d.hourly.thunderstorm_probability[i] || 0) : 0,
      code:    d.hourly.weather_code[i],
      gusts:   Math.round(d.hourly.wind_gusts_10m[i] || 0),
      uv:      Math.round(d.hourly.uv_index[i] || 0),
      cloud:   Math.round(d.hourly.cloud_cover[i] || 0),
      vis:     Math.round((d.hourly.visibility[i] || 10000) / 1000)
    };
  }).filter(function(x) { return x.h >= nowH; }).slice(0, 9);

  /* alertas contextuais — mesma logica de renderWeather */
  var alerts = [];

  if(feels >= 38) {
    alerts.push(wctxBlock('danger', '\uD83D\uDD25', 'Calor extremo \u2014 sensacao de ' + feels + '\u00B0C',
      'Hidrate-se a cada 30 min. Prefira atracoes cobertas e com ar-condicionado entre 11h-15h.'));
  } else if(feels >= 32) {
    alerts.push(wctxBlock('warn', '\uD83C\uDF21\uFE0F', 'Calor intenso \u2014 sensacao de ' + feels + '\u00B0C',
      'Planeje pausas em areas cobertas. Sorvete e fontes de agua sao essenciais.'));
  } else if(feels >= 28) {
    alerts.push(wctxBlock('info', '\uD83C\uDF21\uFE0F', 'Calor moderado \u2014 sensacao de ' + feels + '\u00B0C',
      'Dia quente tipico de Orlando. Protetor solar e agua sao essenciais nas filas ao ar livre.'));
  } else if(feels <= 10) {
    alerts.push(wctxBlock('info', '\uD83E\uDDE5', 'Frio \u2014 sensacao de ' + feels + '\u00B0C',
      'Atracoes molhadas sao desconfortaveis hoje. Fila das atracoes cobertas pode ser menor.'));
  }

  if(humidity >= 80) {
    alerts.push(wctxBlock('warn', '\uD83D\uDCA7', 'Umidade alta \u2014 ' + humidity + '%',
      'Dia abafado. Ventilador portatil e molhar o pescoco ajudam em filas ao ar livre.'));
  } else if(humidity >= 65) {
    alerts.push(wctxBlock('info', '\uD83D\uDCA7', 'Umidade elevada \u2014 ' + humidity + '%',
      'Umidade tipica de Orlando. Amplifica a sensacao de calor nas filas externas.'));
  }

  var stormHours = hours.filter(function(x) { return x.storm >= 40; });
  var heavyStorm = stormHours.filter(function(x) { return x.storm >= 65; });
  if(heavyStorm.length) {
    var shStr = heavyStorm.map(function(x){ return x.h + 'h'; }).join(', ');
    alerts.push(wctxBlock('danger', '\u26A1', 'Tempestade provavel as ' + shStr,
      'Atracoes ao ar livre fecham durante alertas de raios (Dumbo, TRON, Big Thunder, Astro Orbiter).'));
  } else if(stormHours.length) {
    alerts.push(wctxBlock('warn', '\u26A1', 'Risco de tempestade \u2014 ' + stormHours.map(function(x){ return x.h+'h'; }).join(', '),
      'Atracoes ao ar livre podem fechar temporariamente. Tenha um plano B coberto.'));
  } else {
    var afternoonRain = hours.filter(function(x){ return x.h >= 12 && x.h <= 20 && x.rain >= 50; });
    var heavyRain     = afternoonRain.filter(function(x){ return x.rain >= 75; });
    if(heavyRain.length) {
      alerts.push(wctxBlock('danger', '\uD83C\uDF27\uFE0F', 'Chuva forte as ' + heavyRain.map(function(x){ return x.h+'h'; }).join(', '),
        'Atracoes cobertas vao lotar quando chover. Priorize-as de manha.'));
    } else if(afternoonRain.length) {
      alerts.push(wctxBlock('info', '\uD83C\uDF27\uFE0F', 'Chuva provavel as ' + afternoonRain.map(function(x){ return x.h+'h'; }).join(', '),
        'Chuva de tarde e classica em Orlando. Poncho ou capa de chuva e essencial.'));
    }
  }

  if(uvNow >= 8) {
    alerts.push(wctxBlock(uvNow >= 11 ? 'danger' : 'warn', '\uD83C\uDF1E', 'UV ' + uvNow + ' \u2014 ' + (uvNow >= 11 ? 'Extremo' : 'Muito alto'),
      'Protetor solar FPS 50+ obrigatorio. Prefira atracoes cobertas entre 10h-14h.'));
  } else if(uvNow >= 5) {
    alerts.push(wctxBlock('info', '\uD83C\uDF1E', 'UV ' + uvNow + ' \u2014 Alto',
      'Protetor solar recomendado, especialmente nas filas ao ar livre.'));
  }

  if(gusts >= 40) {
    alerts.push(wctxBlock('danger', '\uD83C\uDF2C\uFE0F', 'Rajadas fortes \u2014 ' + gusts + ' km/h',
      'Dumbo, Magic Carpets e Astro Orbiter podem fechar sem aviso previo.'));
  } else if(gusts >= 25) {
    alerts.push(wctxBlock('warn', '\uD83C\uDF2C\uFE0F', 'Vento com rajadas \u2014 ' + gusts + ' km/h',
      'Chapeus e itens leves podem voar nas filas ao ar livre.'));
  }

  var visNow = hours.length ? hours[0].vis : 10;
  if(visNow <= 1) {
    alerts.push(wctxBlock('warn', '\uD83C\uDF2B\uFE0F', 'Neblina densa \u2014 visibilidade ' + visNow + ' km',
      'Atracoes ao ar livre podem abrir com atraso. Costuma dissipar antes das 10h.'));
  }

  var eveningHours = hours.filter(function(x){ return x.h >= 20 && x.h <= 23; });
  if(eveningHours.length) {
    var avgCloud = Math.round(eveningHours.reduce(function(a,b){ return a + b.cloud; }, 0) / eveningHours.length);
    if(avgCloud >= 75) {
      alerts.push(wctxBlock('warn', '\uD83C\uDF86', 'Ceu encoberto a noite \u2014 ' + avgCloud + '% nuvens',
        'Visibilidade dos fogos pode ser prejudicada. Chegue cedo para garantir boa posicao.'));
    } else if(avgCloud >= 45) {
      alerts.push(wctxBlock('info', '\uD83C\uDF86', 'Nuvens a noite \u2014 ' + avgCloud + '% cobertura',
        'Fogos provavelmente visiveis, mas com visual reduzido nos momentos mais encobertos.'));
    } else {
      alerts.push(wctxBlock('ok', '\uD83C\uDF86', 'Ceu limpo a noite \u2014 ' + avgCloud + '% nuvens',
        'Otima visibilidade para os shows noturnos hoje.'));
    }
  }

  var uvLabel = uvNow >= 11 ? 'Extremo' : uvNow >= 8 ? 'Muito alto' : uvNow >= 6 ? 'Alto' : uvNow >= 3 ? 'Moderado' : 'Baixo';

  /* ── PREVISAO DO DIA TODO ────────────────────────────────── */
  // Todos os dados horarios do dia (0h-23h)
  var allHours = (d.hourly.time || []).map(function(t, i) {
    return {
      h:      new Date(t).getHours(),
      temp:   Math.round(d.hourly.temperature_2m[i]),
      feels:  Math.round(d.hourly.apparent_temperature[i]),
      rain:   d.hourly.precipitation_probability[i] || 0,
      storm:  d.hourly.thunderstorm_probability ? (d.hourly.thunderstorm_probability[i] || 0) : 0,
      code:   d.hourly.weather_code[i],
      uv:     Math.round(d.hourly.uv_index[i] || 0),
      cloud:  Math.round(d.hourly.cloud_cover[i] || 0)
    };
  }).filter(function(x){ return x.h >= 0 && x.h <= 23; });

  // Agrupa em 4 periodos do parque
  var periods = [
    { label:'Manhã',   emoji:'🌅', hours: allHours.filter(function(x){ return x.h >= 8  && x.h <= 11; }) },
    { label:'Tarde',   emoji:'☀️',  hours: allHours.filter(function(x){ return x.h >= 12 && x.h <= 16; }) },
    { label:'Fim tarde', emoji:'🌆', hours: allHours.filter(function(x){ return x.h >= 17 && x.h <= 19; }) },
    { label:'Noite',   emoji:'🌙', hours: allHours.filter(function(x){ return x.h >= 20 && x.h <= 23; }) }
  ].map(function(p) {
    if(!p.hours.length) return null;
    var avgTemp  = Math.round(p.hours.reduce(function(a,b){ return a+b.temp; },0) / p.hours.length);
    var maxRain  = Math.max.apply(null, p.hours.map(function(x){ return x.rain; }));
    var maxStorm = Math.max.apply(null, p.hours.map(function(x){ return x.storm; }));
    var maxUv    = Math.max.apply(null, p.hours.map(function(x){ return x.uv; }));
    var domCode  = p.hours[Math.floor(p.hours.length/2)].code;
    return { label:p.label, emoji:p.emoji, avgTemp:avgTemp, maxRain:maxRain, maxStorm:maxStorm, maxUv:maxUv, code:domCode };
  }).filter(Boolean);

  // Resumo textual do dia
  var maxStormDay  = Math.max.apply(null, allHours.map(function(x){ return x.storm; }));
  var maxRainDay   = Math.max.apply(null, allHours.filter(function(x){ return x.h >= 10 && x.h <= 20; }).map(function(x){ return x.rain; }));
  var maxUvDay     = Math.max.apply(null, allHours.map(function(x){ return x.uv; }));
  var maxFeelsDay  = Math.max.apply(null, allHours.map(function(x){ return x.feels; }));
  var avgCloudNight= allHours.filter(function(x){ return x.h >= 20; }).length
    ? Math.round(allHours.filter(function(x){ return x.h >= 20; }).reduce(function(a,b){ return a+b.cloud; },0) / allHours.filter(function(x){ return x.h >= 20; }).length)
    : 0;

  var summaryParts = [];
  if(maxStormDay >= 60)     summaryParts.push('tempestade com raios prevista \u2014 atracoes ao ar livre podem fechar');
  else if(maxStormDay >= 35) summaryParts.push('risco de raios a tarde \u2014 tenha atracoes cobertas como plano B');
  else if(maxRainDay >= 70) summaryParts.push('chuva forte a tarde \u2014 poncho e essencial');
  else if(maxRainDay >= 45) summaryParts.push('chuva provavel a tarde \u2014 tipico de Orlando no verao');
  else                       summaryParts.push('dia sem chuva significativa');

  if(maxFeelsDay >= 38)      summaryParts.push('calor extremo (sensacao ate ' + maxFeelsDay + '\u00B0C)');
  else if(maxFeelsDay >= 32) summaryParts.push('dia quente (sensacao ate ' + maxFeelsDay + '\u00B0C)');

  if(maxUvDay >= 9)          summaryParts.push('UV ' + maxUvDay + ' no pico \u2014 protetor solar obrigatorio');

  if(avgCloudNight >= 70)    summaryParts.push('fogos com visibilidade reduzida a noite');
  else if(avgCloudNight <= 30) summaryParts.push('ceu aberto para os shows noturnos');

  var summaryText = summaryParts.length ? summaryParts.join(' &middot; ') : 'Dia favoravel para o parque';
  // Primeira letra maiuscula
  summaryText = summaryText.charAt(0).toUpperCase() + summaryText.slice(1);

  var periodsHtml = '<div class="weather-daily-periods">'
    + periods.map(function(p) {
        var rainColor = p.maxStorm >= 40 ? 'var(--red)' : p.maxRain >= 50 ? 'var(--blue)' : 'var(--text3)';
        var rainVal   = p.maxStorm >= 40 ? '\u26A1' + p.maxStorm + '%' : p.maxRain + '%';
        return '<div class="wdp">'
          + '<div class="wdp-label">' + p.label + '</div>'
          + '<div class="wdp-icon">' + weatherIcon(p.code) + '</div>'
          + '<div class="wdp-temp">' + p.avgTemp + '\u00B0C</div>'
          + '<div class="wdp-rain" style="color:' + rainColor + '">' + rainVal + '</div>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<div class="weather-daily-summary">'
    + '<strong>\uD83D\uDCC5 Previsao do dia</strong>'
    + summaryText
    + '</div>';

  cont.innerHTML = '<div class="weather-card" style="margin-bottom:0;">'
    + '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;margin-bottom:12px;">'
    + '<div style="font-size:42px;line-height:1;">' + weatherIcon(code) + '</div>'
    + '<div style="font-size:26px;font-weight:700;color:var(--text);line-height:1.1;">' + temp + '\u00B0C</div>'
    + '<div style="font-size:12px;color:var(--text2);margin-top:2px;">'
    + weatherDesc(code)
    + ' &middot; sensacao ' + feels + '\u00B0C'
    + ' &middot; ' + humidity + '% umidade'
    + (gusts > 0 ? ' &middot; rajadas ' + gusts + ' km/h' : '')
    + '</div>'
    + (uvNow > 0 ? '<div style="font-size:11px;color:var(--text3);margin-top:1px;">UV ' + uvNow + ' &middot; ' + uvLabel + '</div>' : '')
    + '</div>'
    + periodsHtml
    + (alerts.length ? '<div class="weather-ctx-grid">' + alerts.join('') + '</div>' : '')
    + '</div>';
}

var PF_KEYWORDS = [
  { key:'parade',     type:'parade',    icon:'🎠', label:'Parade' },
  { key:'festival of fantasy', type:'parade', icon:'🎠', label:'Festival of Fantasy' },
  { key:'boo-to-you', type:'parade',   icon:'🎃', label:'Boo To You Parade' },
  { key:'cavalcade',  type:'parade',   icon:'🎠', label:'Cavalcade' },
  { key:'starlight',  type:'parade',   icon:'🌟', label:'Disney Starlight' },
  { key:'happily ever after', type:'fireworks', icon:'🎆', label:'Happily Ever After' },
  { key:'enchantment',type:'fireworks',icon:'🎆', label:'Disney Enchantment' },
  { key:'luminous',   type:'fireworks',icon:'🎆', label:'Luminous' },
  { key:'harmonious', type:'fireworks',icon:'🎆', label:'Harmonious' },
  { key:'not-so-spooky', type:'fireworks', icon:'🎆', label:'Not-So-Spooky Spectacular' },
  { key:'fantasmic',  type:'show-event',icon:'🌊', label:'Fantasmic!' },
  { key:'wonderful world', type:'show-event', icon:'🎥', label:'Wonderful World of Animation' },
  { key:'movie magic',type:'show-event',icon:'🎬', label:'Movie Magic' },
];

function detectPFShows() {
  var results = [];
  S.shows.forEach(function(e) {
    var n = e.name.toLowerCase();
    PF_KEYWORDS.forEach(function(kw) {
      if(n.includes(kw.key) && !results.find(function(r){ return r.id === e.id; })) {
        results.push({ id:e.id, name:e.name, type:kw.type, icon:kw.icon, entity:e });
      }
    });
  });
  return results;
}

function renderPFTracker() {
  var el   = document.getElementById('pf-section');
  var cont = document.getElementById('pf-content');
  if(!el || !cont) return;

  var pfShows = detectPFShows();
  if(!pfShows.length) { el.style.display = 'none'; return; }

  // Calcula o proximo horario de cada show e ordena do mais proximo ao mais distante
  var pfWithNext = pfShows.map(function(pf) {
    var times = (pf.entity.showtimes || []).slice()
      .sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); })
      .filter(function(st){
        var d = st.startTime ? st.startTime.substring(0,10) : null;
        return !d || d === todayStr();
      });
    var next = times.find(function(st){ return minsTo(st.startTime) >= -5; });
    return { pf: pf, next: next, minsToNext: next ? minsTo(next.startTime) : 99999 };
  }).filter(function(x){ return x.next != null; })
    .sort(function(a,b){ return a.minsToNext - b.minsToNext; });

  if(!pfWithNext.length) { el.style.display = 'none'; return; }

  var html = '';
  pfWithNext.forEach(function(item) {
    var pf = item.pf;
    var e = pf.entity;
    var times = (e.showtimes || []).slice()
      .sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); })
      .filter(function(st){
        var d = st.startTime ? st.startTime.substring(0,10) : null;
        return !d || d === todayStr();
      });

    var next = item.next;
    var m    = item.minsToNext;

    var isNow    = m != null && m >= -5 && m <= 5;
    var isSoon   = m != null && m > 5  && m <= 45;
    var cdColor  = pf.type === 'fireworks' ? 'var(--purple)' : 'var(--gold)';
    var pillNext = pf.type === 'fireworks' ? 'fw-next' : 'next';

    var cdHtml = '';
    if(isNow) {
      cdHtml = '<div class="pf-cd-wrap"><span class="pf-now-badge">Agora!</span></div>';
    } else if(m != null && m >= 0) {
      cdHtml = '<div class="pf-cd-wrap">'
        + '<div class="pf-cd-num" style="color:' + cdColor + '" id="pf-cd-' + e.id + '">' + m + '</div>'
        + '<div class="pf-cd-unit">min</div>'
        + '</div>';
    }

    var sd = getStatic(e);
    var areaText = sd && sd.area ? '\uD83D\uDCCD ' + sd.area : '';

    var coords = S.coordCache[e.id];
    var mapsUrl = coords
      ? 'https://www.google.com/maps/dir/?api=1&destination=' + coords.lat + ',' + coords.lng + '&travelmode=walking'
      : 'https://www.google.com/maps/search/' + encodeURIComponent(e.name + ' Walt Disney World');

    var pillsHtml = times.map(function(st){
      var mm = minsTo(st.startTime);
      var isPast = mm != null && mm < -5;
      var isNext = st === next && !isNow;
      return '<span class="pf-pill '+(isPast?'past':'')+(isNext?' '+pillNext:'')+'">'
        + fmt(st.startTime) + '</span>';
    }).join('');

    html += '<div class="pf-card ' + pf.type + '">'
      + '<div class="pf-top">'
      + '<div class="pf-icon">' + pf.icon + '</div>'
      + '<div class="pf-meta">'
      + '<div class="pf-name">' + e.name + '</div>'
      + '<div class="pf-area">' + areaText + '</div>'
      + '</div>'
      + cdHtml
      + '</div>'
      + (times.length ? '<div class="pf-times" style="margin-top:10px;">' + pillsHtml + '</div>' : '')
      + '<div style="margin-top:10px;display:flex;justify-content:flex-end;">'
      + '<a href="' + mapsUrl + '" target="_blank" class="btn-maps" title="Rota no Maps">\uD83D\uDCCD</a>'
      + '</div>'
      + '</div>';
  });

  cont.innerHTML = html;
  el.style.display = 'block';
}

function tickPFCountdowns() {
  var pfShows = detectPFShows();
  pfShows.forEach(function(pf) {
    var e = pf.entity;
    var times = (e.showtimes || []).slice()
      .sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); })
      .filter(function(st){
        var d = st.startTime ? st.startTime.substring(0,10) : null;
        return !d || d === todayStr();
      });
    var next = times.find(function(st){ return minsTo(st.startTime) >= -5; });
    var el2  = document.getElementById('pf-cd-' + e.id);
    if(el2 && next) {
      var m = minsTo(next.startTime);
      if(m != null && m >= 0) el2.textContent = m;
    }
  });
}

/* ============================================================
   FEATURE 7 — ROTEIRO DINAMICO POR AREA
   Usa forecast.percentage por area + horários PF + clima
   ============================================================ */
function buildItinerary() {
  var el   = document.getElementById('itin-section');
  var cont = document.getElementById('itin-content');
  if(!el || !cont) return;

  var nowH = new Date().getHours();

  // Coleta areas com forecast
  var attsWithFc = S.att.filter(function(e){
    return e.status === 'OPERATING' && e.forecast && e.forecast.length > 0;
  });
  if(!attsWithFc.length) { el.style.display = 'none'; return; }

  // Monta mapa: area -> {pctNow, pctFuture[h+1..h+4]}
  var areaMap = {};
  attsWithFc.forEach(function(e) {
    var sd  = getStatic(e);
    var area = sd && sd.area ? sd.area.split(' - ')[0].split(':')[0].trim() : 'Outros';
    if(!areaMap[area]) areaMap[area] = { now:[], future:{} };
    var fcNow = e.forecast.find(function(f){ return new Date(f.time).getHours() === nowH; });
    if(fcNow) areaMap[area].now.push(fcNow.percentage);
    for(var d = 1; d <= 4; d++) {
      var th = (nowH + d) % 24;
      var fcF = e.forecast.find(function(f){ return new Date(f.time).getHours() === th; });
      if(fcF) {
        if(!areaMap[area].future[th]) areaMap[area].future[th] = [];
        areaMap[area].future[th].push(fcF.percentage);
      }
    }
  });

  // Calcula media por area
  var areas = Object.keys(areaMap).map(function(name) {
    var ns  = areaMap[name].now;
    var pctNow = ns.length ? Math.round(ns.reduce(function(a,b){return a+b;},0)/ns.length) : 50;
    // Media futura nas proximas 2h
    var futPcts = [];
    for(var d = 1; d <= 2; d++) {
      var th = (nowH + d) % 24;
      var arr = areaMap[name].future[th];
      if(arr && arr.length) futPcts.push(Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length));
    }
    var pctFuture = futPcts.length ? Math.round(futPcts.reduce(function(a,b){return a+b;},0)/futPcts.length) : pctNow;
    var trend = pctFuture - pctNow;
    return { name:name, pctNow:pctNow, pctFuture:pctFuture, trend:trend };
  }).filter(function(a){ return a.name !== 'Outros'; });

  if(!areas.length) { el.style.display = 'none'; return; }

  // Detecta horario do proximo evento-ancora (parade / fireworks)
  var pfShows = detectPFShows();
  var nextAnchor = null;
  pfShows.forEach(function(pf) {
    var times = (pf.entity.showtimes || []).slice()
      .sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); })
      .filter(function(st){ var d=st.startTime?st.startTime.substring(0,10):null; return !d||d===todayStr(); });
    var nx = times.find(function(st){ return minsTo(st.startTime) > 5; });
    if(nx && (!nextAnchor || new Date(nx.startTime) < new Date(nextAnchor.time))) {
      nextAnchor = { name:pf.name, icon:pf.icon, time:nx.startTime, minsTo:minsTo(nx.startTime), type:pf.type };
    }
  });

  // Detecta alerta de chuva da tarde (usando S.weather se disponivel)
  var rainAlertH = null;
  if(S.weather && S.weather.hourly) {
    var hourly = (S.weather.hourly.time || []).map(function(t,i){
      return { h:new Date(t).getHours(), rain:S.weather.hourly.precipitation_probability[i]||0 };
    });
    var firstRain = hourly.find(function(x){ return x.h > nowH && x.h <= 20 && x.rain >= 50; });
    if(firstRain) rainAlertH = firstRain.h;
  }

  // Estrategia de ordenacao:
  // 1. Areas com pctNow baixo E tendencia de alta — ir AGORA (janela curta)
  // 2. Areas com pctFuture baixo e tendencia de queda — ir mais tarde
  // 3. Antes do evento-ancora: areas proximas ao ponto de visualizacao (Main Street, etc.)
  // Ordena por score: pctNow * 0.6 + pctFuture * 0.4
  var scored = areas.map(function(a) {
    var score = a.pctNow * 0.6 + a.pctFuture * 0.4;
    return { area:a, score:score };
  }).sort(function(a,b){ return a.score - b.score; });

  // Separa areas de "posicao para evento" por parque
  var anchorAreas = ['Main Street U.S.A.', 'World Showcase', 'Hollywood Boulevard', 'Sunset Boulevard', 'Fantasyland'];

  var steps = [];
  var used  = {};

  // Primeira etapa: areas mais tranquilas agora
  scored.forEach(function(s) {
    if(steps.length >= 4) return;
    if(used[s.area.name]) return;
    var isAnchor = anchorAreas.some(function(a){ return s.area.name.includes(a); });
    // Se ha evento-ancora em menos de 60min, reserva areas de posicao para o fim
    if(nextAnchor && nextAnchor.minsTo <= 60 && isAnchor && !used[s.area.name]) return;
    var tip = '';
    if(s.area.pctNow <= 30)       tip = 'Filas bem abaixo do normal — aproveite agora.';
    else if(s.area.trend > 10)    tip = 'Esta tranquilo agora mas deve encher. Va primeiro.';
    else if(s.area.trend < -10)   tip = 'Tendencia de queda — fila vai diminuir nas proximas horas.';
    else if(s.area.pctFuture < s.area.pctNow - 5) tip = 'Ficara mais tranquilo em breve.';
    else                           tip = 'Movimento moderado e estavel.';
    if(rainAlertH && s.area.name.toLowerCase().includes('galaxy') || 
       (rainAlertH && s.area.pctNow <= 40)) {
      tip += ' Aproveite antes da chuva prevista as ' + rainAlertH + 'h.';
    }
    steps.push({ area:s.area, tip:tip });
    used[s.area.name] = true;
  });

  // Se ha evento-ancora proximo, adiciona como ultimo passo
  if(nextAnchor && nextAnchor.minsTo <= 120) {
    var _pid = S.park ? S.park.apiId : '';
  var _anchorPos = nextAnchor.type === 'parade'
    ? (_pid === MK_ID ? 'no Main Street U.S.A. com 20-30 min de antecedencia.'
       : _pid === HS_ID ? 'no Hollywood Boulevard com 20-30 min de antecedencia.'
       : 'no ponto de visualizacao com 20-30 min de antecedencia.')
    : (_pid === EPCOT_ID ? 'na beira do lago World Showcase com 15-20 min de antecedencia.'
       : _pid === MK_ID  ? 'proximo ao Hub em frente ao Castelo com 15-20 min de antecedencia.'
       : _pid === HS_ID  ? 'no Sunset Boulevard com 15-20 min de antecedencia.'
       : 'na area de visualizacao com 15-20 min de antecedencia.');
  var anchorTip = nextAnchor.icon + ' ' + nextAnchor.name + ' em ' + nextAnchor.minsTo + ' min'
      + ' — posicione-se ' + _anchorPos;
    steps.push({ area:null, tip:anchorTip, isAnchor:true, anchorData:nextAnchor });
  }

  if(!steps.length) { el.style.display = 'none'; return; }

  var html = '<div class="itin-card">'
    + '<div class="itin-title">Sugestao com base nas filas e previsao das proximas horas</div>';

  steps.forEach(function(step, i) {
    if(step.isAnchor) {
      html += '<div class="itin-step">'
        + '<div class="itin-step-num" style="background:rgba(240,180,41,.18);color:var(--gold)">' + step.anchorData.icon + '</div>'
        + '<div class="itin-step-body">'
        + '<div class="itin-step-area">' + step.anchorData.name + '</div>'
        + '<div class="itin-step-tip">' + step.tip + '</div>'
        + '</div></div>';
    } else {
      var a = step.area;
      var pctColor2 = pctColor(a.pctNow);
      var trendStr  = a.trend > 8  ? ' &uarr;' + a.trend + '%'
                    : a.trend < -8 ? ' &darr;' + Math.abs(a.trend) + '%' : '';
      var isGoNow   = i === 0 && a.pctNow <= 40;
      html += '<div class="itin-step">'
        + '<div class="itin-step-num' + (isGoNow ? ' go-now' : '') + '">' + (i+1) + '</div>'
        + '<div class="itin-step-body">'
        + '<div class="itin-step-area">' + a.name + '</div>'
        + '<div class="itin-step-pct" style="color:' + pctColor2 + '">'
        + pctLabel(a.pctNow) + ' &middot; ' + a.pctNow + '%' + trendStr
        + '</div>'
        + '<div class="itin-step-tip">' + step.tip + '</div>'
        + '</div></div>';
    }
  });

  // Nota de rodape
  var note = 'Roteiro baseado no percentual de ocupacao historico de cada area agora'
    + (rainAlertH ? ' e alerta de chuva as ' + rainAlertH + 'h' : '')
    + (nextAnchor ? ' e no horario do ' + nextAnchor.name : '')
    + '. Atualizado a cada 5 minutos.';
  html += '<div class="itin-note">' + note + '</div>';
  html += '</div>';

  cont.innerHTML = html;
  el.style.display = 'block';
}

/* ============================================================
   DETECTOR DE JANELA DE OPORTUNIDADE POS-CHUVA
   Combina weather_code do Open-Meteo com historico de filas
   ============================================================ */

// Retorna true se o weather_code indica chuva/garoa/trovoada
function codeIsRain(code) {
  return code >= 51 && code <= 99;
}

// Classifica uma atracao como coberta ou ao ar livre via STATIC
function isCovered(e) {
  var sd = getStatic(e);
  return sd && sd.covered === true;
}

// Salva snapshot das filas atuais no buffer circular (max 6 = 30 min)
function snapshotQueues() {
  if(!S.att || !S.att.length) return;
  var code = S.weather && S.weather.current ? S.weather.current.weather_code : null;
  var queues = {};
  S.att.forEach(function(e) {
    if(e.queue && e.queue.STANDBY && e.queue.STANDBY.waitTime != null) {
      queues[e.id] = { wait: e.queue.STANDBY.waitTime, covered: isCovered(e), name: e.name };
    }
  });
  S.queueHistory.push({ ts: Date.now(), code: code, queues: queues });
  if(S.queueHistory.length > 6) S.queueHistory.shift();
}

function detectRainWindow() {
  var banner = document.getElementById('rain-window-banner');
  if(!banner) return;

  // Se ja foi dispensado nesta sessao, nao mostrar de novo
  if(S.rainWindow && S.rainWindow.dismissed) return;

  // Precisa de pelo menos 3 snapshots para analise confiavel
  if(S.queueHistory.length < 3) return;

  var now = Date.now();
  var recent  = S.queueHistory.slice(-3); // ultimas 3 entradas (15 min)
  var current = S.queueHistory[S.queueHistory.length - 1];
  var older   = S.queueHistory.slice(0, -1); // tudo menos a mais recente

  // CONDICAO A: choveu recentemente (pelo menos 1 dos ultimos 2 snapshots anteriores tinha chuva)
  var hadRain = older.slice(-2).some(function(s){ return s.code != null && codeIsRain(s.code); });

  // CONDICAO B: clima atual limpo (codigo <= 3 ou precipitacao parou)
  var currentCode = current.code;
  var nowClear = currentCode != null && !codeIsRain(currentCode);

  if(!hadRain || !nowClear) {
    // Janela nao detectada — esconde banner se estava ativo
    if(!S.rainWindow || !S.rainWindow.dismissed) {
      banner.classList.remove('active');
      S.rainWindow = null;
    }
    return;
  }

  // CONDICAO C: divergencia de filas — cobertas ainda altas, abertas ja baixas
  // Calcula media de fila de cada grupo no pico da chuva (2 snapshots anteriores)
  var peakEntry = older.slice(-2).find(function(s){ return s.code != null && codeIsRain(s.code); }) || older[older.length-1];
  if(!peakEntry) return;

  var coveredPeak = [], coveredNow = [], outdoorNow = [];
  Object.keys(current.queues).forEach(function(id) {
    var cur = current.queues[id];
    var peak = peakEntry.queues[id];
    if(cur.covered) {
      coveredNow.push(cur.wait);
      if(peak) coveredPeak.push(peak.wait);
    } else {
      outdoorNow.push({ id: id, name: cur.name, wait: cur.wait, peakWait: peak ? peak.wait : cur.wait });
    }
  });

  if(!coveredNow.length || !outdoorNow.length) return;

  var avgCoveredNow  = coveredNow.reduce(function(a,b){return a+b;},0) / coveredNow.length;
  var avgCoveredPeak = coveredPeak.length ? coveredPeak.reduce(function(a,b){return a+b;},0)/coveredPeak.length : avgCoveredNow;
  var avgOutdoorNow  = outdoorNow.reduce(function(a,b){return a+b.wait;},0) / outdoorNow.length;

  // Divergencia confirmada: cobertas ainda acima de 60% do pico E abertas abaixo de 25 min em media
  var coveredStillHigh = avgCoveredNow >= avgCoveredPeak * 0.60;
  var outdoorStillLow  = avgOutdoorNow <= 25;

  if(!coveredStillHigh || !outdoorStillLow) {
    banner.classList.remove('active');
    if(S.rainWindow && !S.rainWindow.dismissed) S.rainWindow = null;
    return;
  }

  // JANELA DETECTADA
  // Descobre ha quantos minutos parou de chover
  var stoppedEntry = null;
  for(var i = S.queueHistory.length - 1; i >= 0; i--) {
    if(S.queueHistory[i].code != null && codeIsRain(S.queueHistory[i].code)) {
      // O snapshot seguinte a este e quando parou
      if(i + 1 < S.queueHistory.length) stoppedEntry = S.queueHistory[i + 1];
      break;
    }
  }
  var minsAgo  = stoppedEntry ? Math.round((now - stoppedEntry.ts) / 60000) : 0;
  var WINDOW_MINS = 25; // duracao tipica da janela em Orlando
  var minsLeft = Math.max(0, WINDOW_MINS - minsAgo);

  if(minsLeft === 0) {
    banner.classList.remove('active');
    S.rainWindow = null;
    return;
  }

  // Top 3 atracoes ao ar livre com menor fila agora
  var topOutdoor = outdoorNow
    .filter(function(x){ return x.wait != null; })
    .sort(function(a,b){ return a.wait - b.wait; })
    .slice(0, 3);

  // Atualiza estado
  if(!S.rainWindow) S.rainWindow = { detectedAt: now };

  // Renderiza banner
  document.getElementById('rwb-title').textContent = 'Janela pos-chuva aberta!';
  document.getElementById('rwb-sub').textContent =
    'Atrações ao ar livre esvaziaram. As cobertas ainda lotadas — fila curta lá fora por mais ' + minsLeft + ' min.';
  document.getElementById('rwb-cd').textContent = minsLeft;
  document.getElementById('rwb-rides').innerHTML = topOutdoor.map(function(r) {
    return '<div class="rwb-ride">'
      + '<span class="rwb-ride-name">' + r.name + '</span>'
      + '<span class="rwb-ride-wait">' + r.wait + ' min</span>'
      + '</div>';
  }).join('');
  banner.classList.add('active');
}

function dismissRainWindow() {
  S.rainWindow = { dismissed: true };
  var banner = document.getElementById('rain-window-banner');
  if(banner) banner.classList.remove('active');
}

// Ticker a cada 30s para atualizar countdown do banner
function tickRainWindow() {
  if(!S.rainWindow || S.rainWindow.dismissed) return;
  detectRainWindow(); // re-avalia com timestamps atualizados
}

/* ============================================================
   ROTEIRO EM TEMPO REAL — TODOS OS PARQUES
   Haversine + score de fila + forecast + proximidade
   ============================================================ */
var EPCOT_ID = '47f90d2c-e191-4239-a466-5892ef59a88b';
var MK_ID    = '75ea578a-adc8-4116-a54d-dccb60765ef9';
var HS_ID    = '288747d1-8b4f-4a64-867e-ea7c9b27bad8';

// Pontos de entrada de cada parque
var PARK_ENTRANCES = {
  '47f90d2c-e191-4239-a466-5892ef59a88b': { lat: 28.37476, lng: -81.54978, name: 'EPCOT' },   // Spaceship Earth
  '75ea578a-adc8-4116-a54d-dccb60765ef9': { lat: 28.41768, lng: -81.57997, name: 'Magic Kingdom' }, // Entrada / Train Station
  '288747d1-8b4f-4a64-867e-ea7c9b27bad8': { lat: 28.35940, lng: -81.56017, name: 'Hollywood Studios' }, // Hollywood Blvd entrada
};

// Compat: mantém alias para o EPCOT_ENTRANCE usado em anchors inline
var EPCOT_ENTRANCE = PARK_ENTRANCES[EPCOT_ID];

// Velocidade media de caminhada no parque: 70 metros por minuto
var WALK_SPEED = 70;

// Bbox geral de Walt Disney World (cobre os 4 parques)
var WDW_BBOX = { latMin: 28.33, latMax: 28.43, lngMin: -81.61, lngMax: -81.46 };

function haversineMeters(lat1, lng1, lat2, lng2) {
  var R = 6371000;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2)
        + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
        * Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getRouteState() {
  var pid = S.park ? S.park.apiId : 'default';
  if(!S.routeStates) S.routeStates = {};
  if(!S.routeStates[pid]) {
    S.routeStates[pid] = { userLat:null, userLng:null, lastAttId:null, dismissed:new Set(), gpsActive:false, gpsError:null };
  }
  return S.routeStates[pid];
}

function getParkEntrance() {
  var pid = S.park ? S.park.apiId : EPCOT_ID;
  return PARK_ENTRANCES[pid] || EPCOT_ENTRANCE;
}

function getOriginCoords() {
  var rs = getRouteState();
  var entrance = getParkEntrance();
  // 1. GPS ativo
  if(rs.gpsActive && rs.userLat && rs.userLng) return { lat: rs.userLat, lng: rs.userLng, source: 'gps' };
  // 2. Ultima atracao visitada neste parque
  if(rs.lastAttId && S.coordCache[rs.lastAttId]) {
    var c = S.coordCache[rs.lastAttId];
    var e = S.att.find(function(x){ return x.id === rs.lastAttId; });
    return { lat: c.lat, lng: c.lng, source: 'last', name: e ? e.name : '' };
  }
  // 3. Entrada do parque atual
  return { lat: entrance.lat, lng: entrance.lng, source: 'entrance' };
}

function getAttCoords(e) {
  // 1. Cache da API — valida que tem lat/lng numericos reais dentro do WDW
  var cached = S.coordCache[e.id];
  if(cached && typeof cached.lat === 'number' && typeof cached.lng === 'number'
     && cached.lat > WDW_BBOX.latMin && cached.lat < WDW_BBOX.latMax
     && cached.lng > WDW_BBOX.lngMin && cached.lng < WDW_BBOX.lngMax) {
    return cached;
  }
  // 2. STATIC fallback (cobre MK, HS e EPCOT)
  var sd = getStatic(e);
  if(sd && sd.lat) return { lat: sd.lat, lng: sd.lng };
  return null;
}

function walkMinutes(fromLat, fromLng, toLat, toLng) {
  // Valida coordenadas antes de calcular
  if(!fromLat || !fromLng || !toLat || !toLng) return 5;
  if(isNaN(fromLat) || isNaN(fromLng) || isNaN(toLat) || isNaN(toLng)) return 5;
  // Verifica que ambas as coordenadas estao dentro do WDW (cobre MK, EPCOT, HS, AK)
  function inWDW(lat, lng) {
    return lat > WDW_BBOX.latMin && lat < WDW_BBOX.latMax
        && lng > WDW_BBOX.lngMin && lng < WDW_BBOX.lngMax;
  }
  if(!inWDW(fromLat, fromLng) || !inWDW(toLat, toLng)) return 5;
  var meters = haversineMeters(fromLat, fromLng, toLat, toLng);
  // Dentro de qualquer parque nenhuma caminhada racional passa de ~30 min (~2100m)
  if(!isFinite(meters) || meters > 2500) return 5;
  return Math.max(1, Math.round(meters / WALK_SPEED));
}

function forecastDelta(e) {
  // Diferenca entre fila agora e previsao em 1h (positivo = vai subir)
  if(!e.forecast || !e.forecast.length) return 0;
  var nowH = new Date().getHours();
  var fut = e.forecast.find(function(f){ return new Date(f.time).getHours() === nowH + 1; });
  if(!fut) return 0;
  var cur = e.queue && e.queue.STANDBY ? (e.queue.STANDBY.waitTime || 0) : 0;
  return fut.percentage - (cur > 0 ? cur/120*100 : 50); // delta em percentual relativo
}

function scoreAttraction(e, fromLat, fromLng) {
  var coords = getAttCoords(e);
  // Atracoes fechadas ou em manutencao vao para o final da lista
  if(e.status === 'REFURBISHMENT') return 9999;
  if(e.status === 'CLOSED') return 9998;
  var wait = e.queue && e.queue.STANDBY && e.queue.STANDBY.waitTime != null
    ? e.queue.STANDBY.waitTime : 60;
  var distMin = coords ? walkMinutes(fromLat, fromLng, coords.lat, coords.lng) : 15;
  var delta = forecastDelta(e);

  // Normaliza distancia e fila para a mesma escala (0-100)
  var distNorm = Math.min(100, (distMin / 20) * 100);
  var waitNorm = Math.min(100, (wait / 120) * 100);

  // Bonus de proximidade: mesma area da ultima atracao visitada
  var sd = getStatic(e);
  var curArea = null;
  var _rs = getRouteState();
  if(_rs.lastAttId) {
    var lastE = S.att.find(function(x){ return x.id === _rs.lastAttId; });
    if(lastE) { var lastSd = getStatic(lastE); if(lastSd) curArea = lastSd.area; }
  }
  var areaBonus = (sd && curArea && sd.area === curArea) ? 15 : 0;

  // Pesos: distancia 55%, fila 35%, forecast 10%
  return (distNorm * 0.55) + (waitNorm * 0.35) + (delta * 0.10) - areaBonus;
}

function buildRoute() {
  if(!S.park) return null;

  var rs = getRouteState();
  var origin = getOriginCoords();

  // Candidatas: todas as atracoes do parque, nao visitadas, nao dispensadas
  var candidates = S.att.filter(function(e) {
    if(S.visited.has(e.id)) return false;
    if(rs.dismissed.has(e.id)) return false;
    var sd = getStatic(e);
    if(!sd) return false;
    return true;
  });

  if(!candidates.length) return [];

  // Roteiro greedy: a cada passo escolhe a melhor candidata a partir da posicao atual
  var route = [];
  var remaining = candidates.slice();
  var curLat = origin.lat, curLng = origin.lng;
  var timeNow = new Date();
  var curTime = new Date(timeNow); // tempo estimado acumulado

  // Detecta eventos-ancora (PF) para inserir no roteiro
  var anchors = [];
  detectPFShows().forEach(function(pf) {
    var times = (pf.entity.showtimes || []).slice()
      .sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); })
      .filter(function(st){ var d=st.startTime?st.startTime.substring(0,10):null; return !d||d===todayStr(); });
    var next = times.find(function(st){ return minsTo(st.startTime) > 10; });
    if(next) anchors.push({ name: pf.entity.name, icon: pf.icon, startTime: next.startTime, minsTo: minsTo(next.startTime) });
  });
  anchors.sort(function(a,b){ return new Date(a.startTime)-new Date(b.startTime); });

  while(remaining.length) {
    // Verifica se proximo ancora esta proximo (menos de 45 min) — insere pausa
    if(anchors.length) {
      var nextAnchor = anchors[0];
      var minsUntilAnchor = minsTo(nextAnchor.startTime);
      // Se o show comeca em menos de 45 min e ainda nao inserimos
      if(minsUntilAnchor > 0 && minsUntilAnchor <= 45 && !route.find(function(r){ return r.isAnchor && r.name === nextAnchor.name; })) {
        var _ent = getParkEntrance();
        var anchorCoords = { lat: _ent.lat - 0.002, lng: _ent.lng - 0.002 }; // ponto de visualizacao do evento
        route.push({
          isAnchor: true, name: nextAnchor.name, icon: nextAnchor.icon,
          startTime: nextAnchor.startTime, minsTo: minsUntilAnchor,
          estimatedStart: new Date(new Date(nextAnchor.startTime).getTime() - 15*60000),
        });
        anchors.shift();
        curTime = new Date(nextAnchor.startTime);
        continue;
      }
    }

    // Puntua e ordena candidatas pela posicao atual
    var scored = remaining.map(function(e) {
      return { e: e, score: scoreAttraction(e, curLat, curLng) };
    }).sort(function(a,b){ return a.score - b.score; });

    var best = scored[0].e;
    var coords = getAttCoords(best);
    var wait = best.queue && best.queue.STANDBY && best.queue.STANDBY.waitTime != null
      ? best.queue.STANDBY.waitTime : 0;
    var sd = getStatic(best);
    var distMin = coords ? walkMinutes(curLat, curLng, coords.lat, coords.lng) : 5;
    // Sanity check — nunca mais de 20 min de caminhada dentro do EPCOT
    if(distMin > 20) distMin = 5;
    var duration = (sd && sd.duration) ? sd.duration : 5;
    var estStart = new Date(curTime.getTime() + distMin * 60000);
    var estEnd   = new Date(estStart.getTime() + (wait + duration) * 60000);

    route.push({
      e: best, coords: coords, wait: wait, distMin: distMin,
      duration: duration, estStart: estStart, estEnd: estEnd,
      delta: forecastDelta(best), isAnchor: false,
    });

    // Avanca posicao e tempo
    if(coords) { curLat = coords.lat; curLng = coords.lng; }
    curTime = estEnd;
    remaining = remaining.filter(function(x){ return x.id !== best.id; });
  }

  return { route: route, origin: origin };
}

function parkSupportsRoute() {
  // Parque suporta roteiro se tiver ao menos 3 atracoes com dados STATIC (lat/lng)
  if(!S.att || !S.att.length) return false;
  var count = S.att.filter(function(e){ var sd = getStatic(e); return sd && sd.lat; }).length;
  return count >= 3;
}

function renderRoteiro() {
  var cont = document.getElementById('roteiro-content');
  if(!cont) return;

  // Mostra a aba Roteiro para qualquer parque com dados suficientes
  var hasRoute = S.park && parkSupportsRoute();
  var tab = document.getElementById('tab-roteiro');
  if(tab) tab.style.display = hasRoute ? '' : 'none';
  if(!hasRoute) return;

  var result = buildRoute();
  if(!result || !result.route.length) {
    cont.innerHTML = '<div class="rt-empty"><div class="rt-empty-icon">🗺️</div><div>Nenhuma atracao disponivel para o roteiro agora.</div></div>';
    return;
  }

  var route   = result.route;
  var origin  = result.origin;
  var rs      = getRouteState();

  // Calcula totais
  var totalWait = route.filter(function(r){ return !r.isAnchor; }).reduce(function(a,r){ return a + (r.wait||0); }, 0);
  var totalWalk = route.filter(function(r){ return !r.isAnchor; }).reduce(function(a,r){ return a + Math.min(20, r.distMin||0); }, 0);
  var totalAtts = route.filter(function(r){ return !r.isAnchor; }).length;

  // Fonte da posicao
  var _entrance = getParkEntrance();
  var originLabel = origin.source === 'gps' ? '📍 Usando sua localizacao atual'
    : origin.source === 'last' ? '📍 A partir de: ' + (origin.name || 'ultima atracao')
    : '📍 A partir da entrada do ' + (_entrance.name || 'parque');

  var html = '';

  // Badge do parque atual
  var parkEmoji = S.park ? S.park.emoji : '🗺️';
  var parkName  = S.park ? S.park.name  : 'Parque';
  html += '<div class="rt-epcot-only">' + parkEmoji + ' Roteiro em tempo real &middot; ' + parkName + '</div>';

  // Barra GPS (rs ja foi declarado acima via getRouteState())
  html += '<div class="rt-gps-bar">'
    + '<div class="rt-gps-dot ' + (rs.gpsActive ? 'on' : 'off') + '"></div>'
    + '<span class="rt-gps-label">' + (rs.gpsActive ? 'GPS ativo' : 'GPS desativado') + '</span>'
    + '<button class="rt-gps-btn" onclick="toggleGPS()">' + (rs.gpsActive ? 'Desativar' : 'Ativar GPS') + '</button>'
    + '</div>';

  // Fonte da posicao
  html += '<div class="rt-location-bar">' + originLabel + '</div>';

  // Summary pills
  html += '<div class="rt-summary-bar">'
    + '<div class="rt-summary-pill"><div class="rt-summary-val">' + totalAtts + '</div><div class="rt-summary-lbl">atracoes</div></div>'
    + '<div class="rt-summary-pill"><div class="rt-summary-val">' + totalWait + ' min</div><div class="rt-summary-lbl">em fila</div></div>'
    + '<div class="rt-summary-pill"><div class="rt-summary-val">' + totalWalk + ' min</div><div class="rt-summary-lbl">caminhada</div></div>'
    + '</div>';

  // Timeline
  html += '<div class="rt-timeline">';
  route.forEach(function(step, idx) {
    var isFirst = idx === 0;
    if(step.isAnchor) {
      var mTo = minsTo(step.startTime);
      var _isParade = step.name && (step.name.toLowerCase().includes('parade')||step.name.toLowerCase().includes('cavalcade')||step.name.toLowerCase().includes('festival'));
      var _anchorAreaLabel = _isParade ? 'Evento ancora — posicione-se na rua principal' : 'Evento ancora — posicione-se no ponto de visualizacao';
      var _antecedencia = _isParade ? '20-30 min' : '15 min';
      html += '<div class="rt-step">'
        + '<div class="rt-step-line">'
        + '<div class="rt-step-node anchor">' + step.icon + '</div>'
        + '<div class="rt-step-connector"></div>'
        + '</div>'
        + '<div class="rt-step-body">'
        + '<div class="rt-step-time">Em ' + (mTo > 0 ? mTo + ' min' : 'breve') + ' — posicione-se ' + _antecedencia + ' antes</div>'
        + '<div class="rt-step-card anchor">'
        + '<div class="rt-card-top">'
        + '<div><div class="rt-card-name">' + step.name + '</div><div class="rt-card-area">' + _anchorAreaLabel + '</div></div>'
        + '<div class="rt-card-right"><div class="rt-card-wait" style="color:var(--purple)">' + (mTo > 0 ? mTo : '--') + '</div><div class="rt-card-wait-lbl">min</div></div>'
        + '</div>'
        + '</div></div></div>';
      return;
    }

    var e = step.e;
    var sd = getStatic(e);
    var isClosed = e.status === 'CLOSED' || e.status === 'REFURBISHMENT' || e.status === 'DOWN';
    var waitDisplay = isClosed
      ? (e.status === 'REFURBISHMENT' ? 'Reforma' : 'Fechado')
      : (step.wait > 0 ? step.wait : '--');
    var waitColor = isClosed ? 'var(--text3)' : pctColor(Math.min(100, (step.wait/120)*100));
    var waitLabel = isClosed ? '' : 'min fila';
    var cardOpacity = isClosed ? 'opacity:0.5;' : '';
    var trendHtml = '';
    if(!isClosed) {
      if(step.delta > 8)       trendHtml = ' <span class="rt-trend-up">↑</span>';
      else if(step.delta < -8) trendHtml = ' <span class="rt-trend-down">↓</span>';
    }

    var timeStr = step.estStart
      ? step.estStart.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
      : '';

    html += '<div class="rt-step">'
      + '<div class="rt-step-line">'
      + '<div class="rt-step-node ' + (isFirst && !isClosed ? 'current' : 'next') + '">' + (idx + 1) + '</div>'
      + '<div class="rt-step-connector"></div>'
      + '</div>'
      + '<div class="rt-step-body" style="' + cardOpacity + '">'
      + '<div class="rt-step-time">~' + timeStr + ' &middot; ' + step.distMin + ' min a pe</div>'
      + '<div class="rt-step-card ' + (isFirst && !isClosed ? 'current' : '') + '">'
      + '<div class="rt-card-top">'
      + '<div><div class="rt-card-name">' + e.name + '</div><div class="rt-card-area">' + (sd ? sd.area : '') + '</div></div>'
      + '<div class="rt-card-right"><div class="rt-card-wait" style="color:' + waitColor + '">' + waitDisplay + trendHtml + '</div><div class="rt-card-wait-lbl">' + waitLabel + '</div></div>'
      + '</div>'
      + (!isClosed ? '<div class="rt-card-meta">'
        + '<span class="rt-meta-pill">⏱ ' + step.duration + ' min duracao</span>'
        + (step.distMin > 0 ? '<span class="rt-meta-pill">🚶 ' + step.distMin + ' min</span>' : '')
        + (sd && sd.covered ? '<span class="rt-meta-pill">🏛 Coberta</span>' : '<span class="rt-meta-pill">☀️ Ao ar livre</span>')
        + '</div>' : '')
      + '<div class="rt-card-actions">'
      + (!isClosed ? '<button class="rt-btn rt-btn-done" onclick="markDoneRoute(\'' + e.id + '\')">✓ Feito</button>' : '')
      + '<button class="rt-btn rt-btn-skip" onclick="skipRoute(\'' + e.id + '\')">Pular</button>'
      + '</div>'
      + '</div></div></div>';
  });
  html += '</div>'; // timeline

  cont.innerHTML = html;
}

function markDoneRoute(id) {
  S.visited.add(id);
  getRouteState().lastAttId = id;
  saveV();
  renderRoteiro();
}

function skipRoute(id) {
  getRouteState().dismissed.add(id);
  renderRoteiro();
}

function toggleGPS() {
  var rs = getRouteState();
  if(rs.gpsActive) {
    rs.gpsActive = false; rs.userLat = null; rs.userLng = null;
    renderRoteiro(); return;
  }
  if(!navigator.geolocation) { rs.gpsError = 'GPS nao disponivel neste dispositivo.'; renderRoteiro(); return; }
  navigator.geolocation.getCurrentPosition(function(pos) {
    rs.userLat = pos.coords.latitude;
    rs.userLng = pos.coords.longitude;
    rs.gpsActive = true; rs.gpsError = null;
    renderRoteiro();
  }, function(err) {
    rs.gpsError = 'Permissao de localizacao negada.';
    rs.gpsActive = false;
    renderRoteiro();
  }, { enableHighAccuracy: true, timeout: 8000 });
}

/* --- INIT --- */
async function init() {
  load();
  buildHomeSkeleton();
  renderHomeWeather();
  await Promise.allSettled(PARKS.map(function(p){ return loadHomePark(p); }));
  document.getElementById('home-ticker').textContent='Atualizado as '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  updateHomeEarlyBadges();
  setTimeout(function(){ document.getElementById('loading').classList.add('hide'); },900);
}
init();
</script>
